<style>
  :root{
    --bg:#EEF0EA;
    --surface:#FFFFFF;
    --surface-alt:#F7F8F4;
    --ink:#23291F;
    --ink-soft:#5B6357;
    --ink-faint:#8A9184;
    --accent:#3E6B5C;
    --accent-dark:#2C4F44;
    --accent-soft:#DCE8E1;
    --danger:#B5502E;
    --border:#DEDFD6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 16px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  header.topbar .back{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    color:var(--ink);
    flex-shrink:0;
  }
  header.topbar h1{
    font-family:'Source Serif 4',Georgia,serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .topbar .brand-title{
    font-family:'Playfair Display','Source Serif 4',Georgia,serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.015em;
    background:linear-gradient(120deg, var(--ink) 0%, var(--accent-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .brand-subtitle{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  header.topbar .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  main{padding:0 20px 100px;}

  /* ---- Home / project list ---- */
  .empty-state{
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:38px;margin-bottom:14px;}
  .empty-state p{font-size:15px;line-height:1.6;margin:0;}

  .project-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .project-card:active{transform:scale(0.98);}
  .project-card .icon{
    width:48px;height:48px;
    border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
    overflow:hidden;

let projects = [];

function fmtDate(d){
  const [y,m,day] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(day)}日`;
}
function fmtDateShort(d){
  const [y,m,day] = d.split('-');
  return `${y}-${m}-${day}`;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function showToast(msg, duration){
  clearTimeout(toastTimer);
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display='block';
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, duration || 1800);
}

/* ---- IndexedDB storage ---- */
const DB_NAME = 'change-diary-db';
const STORE = 'kv';
let dbPromise = null;

function withTimeout(promise, ms, message){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(message)), ms);
    promise.then(
      v => { clearTimeout(timer); resolve(v); },
      e => { clearTimeout(timer); reject(e); }
    );
  });
}

function openDB(){
  if(dbPromise) return dbPromise;
  const attempt = withTimeout(new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('此浏览器不支持本地存储')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }), 6000, '本地存储初始化超时，可能是浏览器处于隐私/无痕模式或限制了存储权限，请换成普通浏览模式后重试');
  attempt.catch(()=>{ dbPromise = null; });
  dbPromise = attempt;
  return dbPromise;
}
async function idbGet(key){
  const db = await openDB();
  return withTimeout(new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }), 6000, '读取本地数据超时，请重试');
}
async function idbSet(key, value){
  const db = await openDB();
  return withTimeout(new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }), 6000, '保存本地数据超时，请重试');
}
async function idbDelete(key){
  const db = await openDB();
  return withTimeout(new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }), 6000, '删除本地数据超时，请重试');
}

async function loadProjects(){
  try{
    const r = await idbGet('projects');
    projects = r || [];
  }catch(e){ projects = []; showToast('本地存储不可用：' + e.message); }
}
async function saveProjects(){

}
async function loadMeta(projectId){
  try{
    const list = await idbGet('meta:'+projectId);
    return (list || []).sort((a,b)=> b.date.localeCompare(a.date));

async function saveMeta(projectId, list){

async function savePhoto(projectId, date, dataUrl){

}

  if(!Array.isArray(projects)) projects = [];
  projects = projects.filter(p => p && p.id && typeof p.name === 'string');

function loadImg(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLtoBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/png';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new Blob([bytes], { type: mime });
}

/* ---- EXIF reader ---- */
function getStringFromView(view, start, length){
  let s = '';
  for(let i=0;i<length;i++){ s += String.fromCharCode(view.getUint8(start+i)); }
  return s;
}
function readTiffTags(view, tiffStart, dirStart, little){
  const tags = {};
  if(dirStart + 2 > view.byteLength) return tags;
  const entries = view.getUint16(dirStart, little);
  for(let i=0;i<entries;i++){
    const entryOffset = dirStart + 2 + i*12;
    if(entryOffset + 12 > view.byteLength) break;
    const tag = view.getUint16(entryOffset, little);
    const type = view.getUint16(entryOffset+2, little);
    const count = view.getUint32(entryOffset+4, little);
    const valueOffset = entryOffset+8;
    if(type === 2){
      let strOffset = valueOffset;
      if(count > 4){ strOffset = tiffStart + view.getUint32(valueOffset, little); }
      if(strOffset + count <= view.byteLength){
        tags[tag] = getStringFromView(view, strOffset, Math.max(0,count-1));
      }
    } else if(type === 4){
      tags[tag] = view.getUint32(valueOffset, little);
    } else if(type === 3){
      tags[tag] = view.getUint16(valueOffset, little);
    }
  }
  return tags;
}
function extractExifDate(buffer){
  try{
    const view = new DataView(buffer);
    if(view.getUint16(0) !== 0xFFD8) return null;
    let offset = 2;
    const length = view.byteLength;
    while(offset + 4 <= length){
      if(view.getUint8(offset) !== 0xFF) break;
      const marker = view.getUint8(offset+1);
      if(marker === 0xE1){
        const segStart = offset + 4;
        if(getStringFromView(view, segStart, 4) === 'Exif'){
          const tiffStart = segStart + 6;
          const little = view.getUint16(tiffStart) === 0x4949;
          const ifd0Offset = view.getUint32(tiffStart+4, little);
          const tags = readTiffTags(view, tiffStart, tiffStart+ifd0Offset, little);
          let dateStr = null;
          if(tags[0x8769] !== undefined){
            const exifTags = readTiffTags(view, tiffStart, tiffStart+tags[0x8769], little);
            dateStr = exifTags[0x9003] || exifTags[0x9004] || null;
          }
          if(!dateStr) dateStr = tags[0x0132] || null;
          if(dateStr){
            const m = dateStr.match(/^(\d{4}):(\d{2}):(\d{2})/);
            if(m) return `${m[1]}-${m[2]}-${m[3]}`;
          }
        }
        return null;
      } else if(marker === 0xD8 || (marker >= 0xD0 && marker <= 0xD9) || marker === 0x01){
        offset += 2;
      } else {
        const segLen = view.getUint16(offset+2);
        offset += 2 + segLen;
      }
    }
    return null;
  }catch(e){ return null; }
}
function readExifDate(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e) => resolve(extractExifDate(e.target.result));
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 262144));
  });
}

function enableRangeTapToSet(slider){
  if(!slider || slider._tapToSetBound) return;
  slider._tapToSetBound = true;
  const setFromClientX = (clientX) => {
    const rect = slider.getBoundingClientRect();
    if(rect.width <= 0) return;
    const min = parseFloat(slider.min) || 0;
    const max = parseFloat(slider.max) || 100;
    const step = parseFloat(slider.step) || 1;
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.min(1, Math.max(0, ratio));
    let val = min + ratio * (max - min);
    val = Math.round(val / step) * step;
    val = Math.min(max, Math.max(min, val));
    if(String(val) !== slider.value){
      slider.value = String(val);
      slider.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };
  slider.addEventListener('pointerdown', (e) => { setFromClientX(e.clientX); });
}

function wrapText(ctx, text, maxWidth, maxLines){
  if(!text) return [];
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line.length>0){
      lines.push(line);
      line = chars[i];
      if(lines.length === maxLines) break;
    } else {
      line = test;
    }
  }
  if(lines.length < maxLines && line){ lines.push(line); }
  if(lines.length === maxLines){
    let last = lines[maxLines-1];
    while(ctx.measureText(last+'…').width > maxWidth && last.length>1){
      last = last.slice(0,-1);
    }
    if(Array.from(text).length > lines.join('').length){
      lines[maxLines-1] = last + '…';
    }
  }
  return lines;
}

/* 动态适应字号、无顶部留白、直角满格渲染 */
async function generateComparison(projectName, entries, orientation='horizontal', ratio=0.62){
  const SIZE = 640; 
  const imgs = await Promise.all(entries.map(e => e.photo ? loadImg(e.photo) : Promise.resolve(null)));
  const n = Math.max(1, entries.length);
  
  let width, height;
  if(orientation === 'horizontal'){
    width = Math.max(240, Math.round(SIZE * n));
    height = Math.max(240, Math.round(SIZE * ratio));
  }else{
    // 与纵向预览完全一致：
    // 每张照片 = SIZE × (SIZE × ratio)
    // 整体拼图 = SIZE × (SIZE × ratio × n)
    width = Math.max(240, Math.round(SIZE));
    height = Math.max(240, Math.round(SIZE * ratio * n));
  }

  const dpr = 2;
  const logicalW = width;
  const logicalH = height; // 去除顶部留白，画布高度即为图片拼图高度
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(logicalW * dpr);
  canvas.height = Math.round(logicalH * dpr);
  const ctx = canvas.getContext('2d', {alpha:false});
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  entries.forEach((e, i)=>{
    const img = imgs[i];
    const focalX = e.focalX == null ? 0.5 : e.focalX;
    const focalY = e.focalY == null ? 0.5 : e.focalY;
    const zoom = Math.max(1, e.zoom || 1);
    
    let x = 0, y = 0, w = width, h = height;
    if(orientation === 'horizontal'){
      w = width / n;
      x = i * w;
    } else {
      h = height / n;
      y = i * h;
    }

    ctx.save();
    ctx.beginPath(); 
    ctx.rect(x, y, w, h); 
    ctx.clip();

    if(img){
      const baseScale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      const dw = img.naturalWidth * baseScale * zoom;
      const dh = img.naturalHeight * baseScale * zoom;

      let dx = x + (w - dw) * focalX;
      let dy = y + (h - dh) * focalY;

      ctx.drawImage(img, dx, dy, dw, dh);
    } else {
      ctx.fillStyle = '#E4E7DF'; 
      ctx.fillRect(x, y, w, h);
    }

    // ----------------- 根据图片大小动态计算文字尺寸 -----------------
    const minDim = Math.min(w, h);
    // 日期字体大小: 介于 13px 到 24px 之间，随单元格最小边长缩放
    const dateFontSize = Math.max(13, Math.min(24, Math.round(minDim * 0.065)));
    // 备注字体大小: 介于 11px 到 20px 之间
    const noteFontSize = Math.max(11, Math.min(20, Math.round(dateFontSize * 0.85)));
    
    const pad = Math.max(8, Math.round(minDim * 0.05));
    const textW = Math.max(30, w - pad * 2);
    const lineSpacing = Math.round(noteFontSize * 1.3);

    ctx.textAlign = 'left'; 
    let ty = y + h - pad;

    // 用文字阴影代替遮罩，保证文字在各种照片背景下都清晰可读
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = Math.max(4, Math.round(minDim * 0.02));
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 1;

    // 绘制备注
    if(e.note){
      ctx.font = `400 ${noteFontSize}px Inter, sans-serif`; 
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      const lines = wrapText(ctx, e.note, textW, 2);
      for(let li = lines.length - 1; li >= 0; li--){
        ctx.fillText(lines[li], x + pad, ty);
        ty -= lineSpacing;
      }
      ty -= Math.round(pad * 0.2); // 备注与日期的间距
    }

    // 绘制日期
    ctx.font = `700 ${dateFontSize}px Inter, sans-serif`; 
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fmtDateShort(e.date), x + pad, ty);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.restore();
  });

  return canvas.toDataURL('image/png');
}

/* ---------------- Rendering ---------------- */

async function render(){
  const app = document.getElementById('app');
  if(view.name === 'home'){
    app.innerHTML = renderHome();
    bindHome();
  } else if(view.name === 'project'){
    const proj = projects.find(p=>p.id===view.id);
    const meta = await loadMeta(view.id);
    app.innerHTML = renderProject(proj, meta);
    bindProject(proj, meta);
  } else if(view.name === 'compareCustomize'){
    const proj = projects.find(p=>p.id===view.id);
    const meta = await loadMeta(view.id);
    app.innerHTML = renderCompareCustomize(proj, meta);
    await bindCompareCustomize(proj, meta);
  } else if(view.name === 'compareResult'){
    app.innerHTML = renderCompareResult();
    bindCompareResult();
  }
  if(modal){ renderModal(); } else { const m = document.getElementById('modal-root'); if(m) m.remove(); }
}

        <div class="edit" data-edit="${p.id}">编辑</div>
        <div class="del" data-del="${p.id}">删除</div>
      </div>
    `).join('');
  }
  return `
    <header class="topbar" style="padding-bottom:2px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <svg width="38" height="38" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;" aria-hidden="true">
          <g fill="#2C4F44">
            <path d="M 77.78 27.32 A 76 76 0 0 1 122.22 27.32 Q 106.92 49.02 112.30 81.76 Q 104.57 48.75 77.78 27.32 Z"/>

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderModal(){
  let existing = document.getElementById('modal-root');
  if(existing) existing.remove();
  const root = document.createElement('div');
  root.id = 'modal-root';
  document.body.appendChild(root);

  if(modal.type === 'newProject' || modal.type === 'editProject'){
    const isEdit = modal.type === 'editProject';
    const existing = isEdit ? projects.find(p=>p.id===modal.id) : null;
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>${isEdit ? '编辑记录' : '新建记录'}</h2>
          <div class="field">
            <label>记录名称</label>
            <input type="text" id="np-name" placeholder="例如：牙周恢复 / 脸部变化 / 体态" value="${isEdit ? escapeHtml(existing.name) : ''}">
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="np-cancel">取消</button>
            <button class="save" id="np-save">${isEdit ? '保存' : '创建'}</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#np-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#np-save').onclick = async () => {
      if(!isEdit && __creatingProject) return;
      const name = root.querySelector('#np-name').value.trim();
      if(!name){ showToast('请输入记录名称'); return; }
      const saveBtn = root.querySelector('#np-save');
      saveBtn.disabled = true;
      saveBtn.textContent = isEdit ? '保存中…' : '创建中…';
      const prevName = isEdit ? existing.name : null;
      try{
        if(!isEdit) __creatingProject = true;
        if(isEdit){
          existing.name = name;
          await saveProjects();
          modal = null;
          render();
        } else {
          const now = Date.now();
          const uniqueId = 'proj_' + now.toString(36) + '_' + Math.random().toString(36).slice(2, 10);
          const proj = { id: uniqueId, name, createdAt: now, count:0, lastDate:null };
          projects.unshift(proj);
          await saveProjects();
          modal = null;
          view = { name:'project', id: proj.id };
          render();
        }
      }catch(e){
        if(isEdit){ existing.name = prevName; }
        else { projects.shift(); }
        showToast((isEdit?'保存':'创建')+'失败：' + e.message, 4000);
        saveBtn.disabled = false;
        saveBtn.textContent = isEdit ? '保存' : '创建';
      }
    };
  }

  if(modal.type === 'addEntry'){
    if(entryDraft.date === null) entryDraft.date = todayStr();
    const isEdit = !!entryDraft.editingDate;
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>${isEdit ? '编辑记录' : '添加照片'}</h2>
          <div class="field">
            <label>日期${entryDraft.dateFromExif ? '（已根据照片拍摄时间自动填写）' : ''}</label>
            <input type="date" id="ae-date" value="${entryDraft.date}" max="${todayStr()}">
          </div>
          <div class="field">
            <label>照片</label>
            <div class="photo-picker" id="ae-picker-preview" style="display:${entryDraft.photo?'block':'none'};margin-bottom:10px;">
              <img id="ae-preview" src="${entryDraft.photo||''}">
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button type="button" class="chip-btn" id="ae-camera-btn">📷 拍照</button>
              <button type="button" class="chip-btn" id="ae-gallery-btn">🖼️ 从相册选择</button>
              ${entryDraft.photo ? `<button type="button" class="chip-btn" id="ae-recrop-btn">✂️ 重新裁剪</button>` : ''}
            </div>
            <input type="file" id="ae-file-camera" accept="image/*" capture="environment" style="display:none;">
            <input type="file" id="ae-file-gallery" accept="image/*" style="display:none;">
          </div>
          <div class="field">
            <label>备注（可选）</label>
            <textarea id="ae-note">${escapeHtml(entryDraft.note)}</textarea>
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="ae-cancel">取消</button>
            <button class="save" id="ae-save" ${entryDraft.photo?'':'disabled'}>保存</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#ae-date').oninput = (e) => { entryDraft.date = e.target.value; entryDraft.dateFromExif = false; };
    root.querySelector('#ae-note').oninput = (e) => { entryDraft.note = e.target.value; };
    const handleFile = async (file) => {
      if(!file) return;
      entryDraft.date = root.querySelector('#ae-date').value;
      entryDraft.note = root.querySelector('#ae-note').value;
      const projectId = modal.projectId;
      showToast('正在读取照片信息…');
      try{
        const exifDate = await readExifDate(file);
        if(exifDate){ entryDraft.date = exifDate; entryDraft.dateFromExif = true; }
        const rawDataUrl = await fileToDataUrl(file);
        modal = { type:'cropPhoto', projectId, rawDataUrl };
        render();
      }catch(e){
        showToast('照片读取失败，请换一张试试');
      }
    };
    root.querySelector('#ae-camera-btn').onclick = () => root.querySelector('#ae-file-camera').click();
    root.querySelector('#ae-gallery-btn').onclick = () => root.querySelector('#ae-file-gallery').click();
    root.querySelector('#ae-file-camera').onchange = (e) => handleFile(e.target.files[0]);
    root.querySelector('#ae-file-gallery').onchange = (e) => handleFile(e.target.files[0]);
    const recropBtn = root.querySelector('#ae-recrop-btn');
    if(recropBtn) recropBtn.onclick = () => {
      entryDraft.date = root.querySelector('#ae-date').value;
      entryDraft.note = root.querySelector('#ae-note').value;
      modal = { type:'cropPhoto', projectId: modal.projectId, rawDataUrl: entryDraft.photo };
      render();
    };
    root.querySelector('#ae-cancel').onclick = () => { modal=null; entryDraft = { date:null, note:'', photo:null, editingDate:null }; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; entryDraft = { date:null, note:'', photo:null, editingDate:null }; render(); } };
    root.querySelector('#ae-save').onclick = async () => {
      const date = entryDraft.date;
      const note = entryDraft.note.trim();
      const photo = entryDraft.photo;
      if(!date || !photo){ showToast('请选择日期和照片'); return; }
      const saveBtn = root.querySelector('#ae-save');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';
      try{
        const projectId = modal.projectId;
        const meta = await loadMeta(projectId);
        const oldDate = entryDraft.editingDate;
        if(oldDate && oldDate !== date){
          const oldIdx = meta.findIndex(m=>m.date===oldDate);
          if(oldIdx>=0) meta.splice(oldIdx,1);
          await deletePhoto(projectId, oldDate);
        }
        const idx = meta.findIndex(m=>m.date===date);
        if(idx>=0){ meta[idx].note = note; } else { meta.push({date, note}); }
        await saveMeta(projectId, meta);
        await savePhoto(projectId, date, photo);
        const proj = projects.find(p=>p.id===projectId);
        proj.count = meta.length;
        proj.lastDate = meta.reduce((a,b)=> a>b.date?a:b.date, meta[0].date);
        await saveProjects();
        modal = null;
        entryDraft = { date: null, note: '', photo: null, editingDate: null };
        render();
      }catch(e){
        showToast('保存失败：' + e.message);
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
      }
    };
  }

  if(modal.type === 'cropPhoto'){
    const VW = Math.min(340, window.innerWidth - 64);
    const VH = Math.min(420, Math.round(VW * 1.25));
    const RATIOS = [
      { key:'orig', label:'原图比例' },
      { key:'free', label:'自由裁剪' },
      { key:'1:1',  label:'1:1', v:1 },
      { key:'3:4',  label:'3:4', v:3/4 },
      { key:'4:3',  label:'4:3', v:4/3 },
      { key:'9:16', label:'9:16', v:9/16 },
    ];
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>裁剪照片</h2>
          <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px;">拖动四角可以裁切范围，拖动框内可以移动，用滑块可以放大照片看得更细。尽量让每次拍摄的角度和范围保持一致，对比会更清楚。</p>
          <div id="crop-stage" style="width:${VW}px;height:${VH}px;">
            <img id="crop-img" draggable="false">
            <div id="crop-box">
              <div class="crop-handle nw" data-corner="nw"></div>
              <div class="crop-handle ne" data-corner="ne"></div>
              <div class="crop-handle sw" data-corner="sw"></div>
              <div class="crop-handle se" data-corner="se"></div>
            </div>
          </div>
          <div class="field">
            <label>缩放（放大照片以便精细裁剪）</label>
            <input type="range" id="crop-zoom" min="1" max="2.5" step="0.01" value="1" style="width:100%;">
          </div>
          <div class="field">
            <label>裁剪比例</label>
            <div class="ratio-row">
              ${RATIOS.map(r=>`<button type="button" data-ratio="${r.key}" class="${r.key==='orig'?'sel':''}">${r.label}</button>`).join('')}
            </div>
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="crop-cancel">取消</button>
            <button class="save" id="crop-confirm">完成</button>
          </div>
        </div>
      </div>
    `;
    const stage = root.querySelector('#crop-stage');
    const imgEl = root.querySelector('#crop-img');
    const boxEl = root.querySelector('#crop-box');
    const zoomSlider = root.querySelector('#crop-zoom');
    enableRangeTapToSet(zoomSlider);

    let natW=0, natH=0, scale0=1, z=1, panX=0, panY=0;
    let box = { x:0, y:0, w:VW, h:VH };
    let ratioKey = 'orig', aspectValue = null;

    function imageRect(){
      const scale = scale0*z;
      const iw = natW*scale, ih = natH*scale;
      const ix = (VW-iw)/2 + panX, iy = (VH-ih)/2 + panY;
      return { ix, iy, iw, ih, scale };
    }
    function clampPan(){
      const scale = scale0*z;
      const iw = natW*scale, ih = natH*scale;
      const maxPanX = Math.max(0, (iw-VW)/2 + 60);
      const maxPanY = Math.max(0, (ih-VH)/2 + 60);
      panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
      panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
    }
    function clampBox(){
      const r = imageRect();
      box.w = Math.min(box.w, r.iw);
      box.h = Math.min(box.h, r.ih);
      box.x = Math.min(Math.max(box.x, r.ix), r.ix + r.iw - box.w);
      box.y = Math.min(Math.max(box.y, r.iy), r.iy + r.ih - box.h);
    }
    function applyRatio(){
      if(!natW) return;
      const aspect = ratioKey==='orig' ? (natW/natH) : aspectValue;
      if(aspect == null) return;
      const cx = box.x+box.w/2, cy = box.y+box.h/2;
      const r = imageRect();
      let w = Math.min(box.w, r.iw), h = w/aspect;
      if(h > r.ih){ h = r.ih; w = h*aspect; }
      if(w > r.iw){ w = r.iw; h = w/aspect; }
      box = { x: cx-w/2, y: cy-h/2, w, h };
      clampBox();
    }
    function paint(){
      const r = imageRect();
      imgEl.style.width = r.iw+'px'; imgEl.style.height = r.ih+'px';
      imgEl.style.left = r.ix+'px'; imgEl.style.top = r.iy+'px';
      boxEl.style.left = box.x+'px'; boxEl.style.top = box.y+'px';
      boxEl.style.width = box.w+'px'; boxEl.style.height = box.h+'px';
    }

    loadImg(modal.rawDataUrl).then(img => {
      natW = img.naturalWidth; natH = img.naturalHeight;
      scale0 = Math.min(VW/natW, VH/natH);
      imgEl.src = modal.rawDataUrl;
      const r0 = imageRect();
      box = { x:r0.ix, y:r0.iy, w:r0.iw, h:r0.ih };
      paint();
    });

    root.querySelectorAll('[data-ratio]').forEach(btn=>{
      btn.onclick = () => {
        root.querySelectorAll('[data-ratio]').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        ratioKey = btn.dataset.ratio;
        aspectValue = RATIOS.find(r=>r.key===ratioKey).v || null;
        applyRatio();
        paint();
      };
    });

    zoomSlider.oninput = () => {
      if(!natW) return;
      z = parseFloat(zoomSlider.value);
      clampPan();
      clampBox();
      paint();
    };

    let mode = null;
    let startPX=0, startPY=0, startBox=null, startPan=null, corner=null;

    stage.addEventListener('pointerdown', (e) => {
      if(!natW) return;
      startPX = e.clientX; startPY = e.clientY;
      const target = e.target;
      if(target.classList.contains('crop-handle')){
        mode = 'resize'; corner = target.dataset.corner; startBox = {...box};
      } else if(target === boxEl){
        mode = 'move'; startBox = {...box};
      } else {
        mode = 'pan'; startPan = { x:panX, y:panY };
      }
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    stage.addEventListener('pointermove', (e) => {
      if(!mode || !natW) return;
      const dx = e.clientX - startPX, dy = e.clientY - startPY;
      if(mode === 'pan'){
        panX = startPan.x + dx; panY = startPan.y + dy;
        clampPan();
        clampBox();
      } else if(mode === 'move'){
        box = { x:startBox.x+dx, y:startBox.y+dy, w:startBox.w, h:startBox.h };
        clampBox();
      } else if(mode === 'resize'){
        const locked = ratioKey !== 'free';
        const aspect = ratioKey==='orig' ? (natW/natH) : (aspectValue || (startBox.w/startBox.h));
        let {x,y,w,h} = startBox;
        if(corner==='se'){ w = startBox.w+dx; h = locked ? w/aspect : startBox.h+dy; }
        else if(corner==='nw'){ w = startBox.w-dx; h = locked ? w/aspect : startBox.h-dy; x = startBox.x+startBox.w-w; y = startBox.y+startBox.h-h; }
        else if(corner==='ne'){ w = startBox.w+dx; h = locked ? w/aspect : startBox.h-dy; y = startBox.y+startBox.h-h; }
        else if(corner==='sw'){ w = startBox.w-dx; h = locked ? w/aspect : startBox.h+dy; x = startBox.x+startBox.w-w; }
        w = Math.max(48, w); h = Math.max(48, h);
        box = { x, y, w, h };
        clampBox();
      }
      paint();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(evt => stage.addEventListener(evt, () => { mode = null; }));

    const closeToEdit = () => { modal = { type:'addEntry', projectId: modal.projectId }; render(); };
    root.querySelector('#crop-cancel').onclick = closeToEdit;
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay') closeToEdit(); };
    root.querySelector('#crop-confirm').onclick = async () => {
      const confirmBtn = root.querySelector('#crop-confirm');
      confirmBtn.disabled = true; confirmBtn.textContent = '处理中…';
      try{
        const img = await loadImg(modal.rawDataUrl);
        const r = imageRect();
        const sx = Math.max(0, Math.min(natW-1, (box.x - r.ix)/r.scale));
        const sy = Math.max(0, Math.min(natH-1, (box.y - r.iy)/r.scale));
        const sw = Math.max(1, Math.min(natW-sx, box.w/r.scale));
        const sh = Math.max(1, Math.min(natH-sy, box.h/r.scale));
        let outW = sw, outH = sh;
        if(Math.max(outW,outH) > CROP_OUT_MAX){
          const s = CROP_OUT_MAX/Math.max(outW,outH);
          outW *= s; outH *= s;
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(outW); canvas.height = Math.round(outH);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        entryDraft.photo = canvas.toDataURL('image/jpeg', 0.9);
        closeToEdit();
      }catch(e){
        showToast('裁剪失败，请重试');
        confirmBtn.disabled = false; confirmBtn.textContent = '完成';
      }

          <h2>删除项目</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">此项目下的所有照片和记录都会被删除，且无法恢复。确定要删除吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="cd-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="cd-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#cd-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#cd-confirm').onclick = async () => {
      const id = modal.id;
      const meta = await loadMeta(id);
      for(const e of meta){ await deletePhoto(id, e.date); }
      try{ await idbDelete('meta:'+id); }catch(e){}
      projects = projects.filter(p=>p.id!==id);
      await saveProjects();
      modal = null;
      view = { name:'home' };
      render();
    };
  }

  if(modal.type === 'confirmDeleteEntry'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>删除这条记录</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">${fmtDate(modal.date)} 的照片和备注会被删除。确定吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="ce-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="ce-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#ce-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#ce-confirm').onclick = async () => {
      const { projectId, date } = modal;
      let meta = await loadMeta(projectId);
      meta = meta.filter(m=>m.date!==date);
      await saveMeta(projectId, meta);
      await deletePhoto(projectId, date);
      const proj = projects.find(p=>p.id===projectId);
      proj.count = meta.length;
      proj.lastDate = meta.length ? meta.reduce((a,b)=> a>b.date?a:b.date, meta[0].date) : null;
      await saveProjects();

      modal = null;
      render();
    };
  }
}

async function bindCompareCustomize(proj, meta){
  const strip = document.getElementById('cust-strip');
  const ratioSlider = document.getElementById('cell-ratio');
  enableRangeTapToSet(ratioSlider);
  compareCustom.orientation = compareCustom.orientation || 'horizontal';
  compareCustom.ratio = compareCustom.ratio ?? 0.62;
  compareCustom.forEach(c => {
    c.focalX = c.focalX ?? .5; c.focalY = c.focalY ?? .5; c.zoom = c.zoom ?? 1;
  });
  let activeDate = compareCustom.activeDate || compareCustom[0]?.date || null;
  compareCustom.activeDate = activeDate;

  document.getElementById('back-btn').onclick = () => {
    view = {name:'project', id:proj.id}; compareMode=true; render();
  };

  function setActive(date){
    activeDate = date; compareCustom.activeDate = date;
    document.querySelectorAll('.strip-item').forEach(el => el.classList.toggle('active-item', el.dataset.strip===date));
  }

  function updatePreviewLayout(){
    const vertical = compareCustom.orientation === 'vertical';
    const ratio = compareCustom.ratio ?? 0.62;
    const n = Math.max(1, compareCustom.length);
    const stage = document.querySelector('.cust-preview-stage');
    const wrap = document.querySelector('.cust-preview-wrap');
    strip.classList.toggle('vertical', vertical);

    const availableW = Math.max(240, (wrap?.clientWidth || 420) - 2);
    const maxTotalH = 440;
    let itemW, itemH, rawW, rawH;

    if(vertical){
      itemW = availableW;
      itemH = Math.round(itemW * ratio);
      rawW = itemW; rawH = itemH * n;
      if(rawH > maxTotalH){
        const s = maxTotalH / rawH;
        itemW = Math.max(60, Math.round(itemW * s));
        itemH = Math.round(itemW * ratio);
        rawW = itemW; rawH = itemH * n;
      }
    } else {
      itemW = Math.floor(availableW / n);
      itemH = Math.round(itemW * ratio);
      rawW = itemW * n; rawH = itemH;
      if(rawH > maxTotalH){
        const s = maxTotalH / rawH;
        itemH = Math.max(60, Math.round(itemH * s));
        itemW = Math.round(itemH / ratio);
        rawW = itemW * n; rawH = itemH;
      }
    }

    strip.style.width = rawW + 'px';
    strip.style.height = rawH + 'px';
    strip.style.transform = 'none';

    if(stage){
      stage.style.height = Math.max(1, rawH) + 'px';
      stage.style.minHeight = '0';
    }

    compareCustom.forEach(c => {
      const el = strip.querySelector(`[data-strip="${c.date}"]`);
      if(el){
        el.style.width = itemW + 'px';
        el.style.height = itemH + 'px';
        updateImage(c);
      }
    });

    ratioSlider.value = String(ratio);
  }

  // 预览与最终 Canvas 使用完全相同的裁切/定位算法。
  function updateImage(c){
    const img = document.querySelector(`[data-strip-img="${c.date}"]`);
    const item = strip.querySelector(`[data-strip="${c.date}"]`);
    if(!img || !item || !img.naturalWidth || !img.naturalHeight) return;

    const w = item.clientWidth;
    const h = item.clientHeight;
    if(w <= 0 || h <= 0) return;

    const focalX = c.focalX == null ? 0.5 : c.focalX;
    const focalY = c.focalY == null ? 0.5 : c.focalY;
    const zoom = Math.max(1, c.zoom || 1);

    const baseScale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const dw = img.naturalWidth * baseScale * zoom;
    const dh = img.naturalHeight * baseScale * zoom;

    img.style.width = `${dw}px`;
    img.style.height = `${dh}px`;
    img.style.left = `${(w - dw) * focalX}px`;
    img.style.top = `${(h - dh) * focalY}px`;
  }

  await Promise.all(compareCustom.map(async c => {
    c.photo = await loadPhoto(proj.id, c.date);
    const img = document.querySelector(`[data-strip-img="${c.date}"]`);
    if(img && c.photo){
      img.onload = () => updateImage(c);
      img.src = c.photo;
    }
    updateImage(c);
  }));

  updatePreviewLayout();
  setActive(activeDate);

  document.querySelectorAll('[data-orientation]').forEach(btn => {
    btn.onclick = () => {
      compareCustom.orientation = btn.dataset.orientation;
      document.querySelectorAll('[data-orientation]').forEach(b => b.classList.toggle('active', b === btn));
      updatePreviewLayout();
    };
  });

  ratioSlider.oninput = () => {
    compareCustom.ratio = parseFloat(ratioSlider.value);
    updatePreviewLayout();
  };

  window.addEventListener('resize', updatePreviewLayout);

  strip.addEventListener('click', e => {
    const item = e.target.closest('.strip-item'); 
    if(item) setActive(item.dataset.strip);
  });

  let drag = null, pinch = null;
  const pointers = new Map();

  strip.addEventListener('pointerdown', e => {
    const item = e.target.closest('.strip-item'); if(!item) return;
    const date = item.dataset.strip, c = compareCustom.find(x => x.date === date); if(!c) return;
    setActive(date);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, date });
    if(pointers.size === 2){
      const pts = [...pointers.values()], a = pts[0], b = pts[1];
      const target = compareCustom.find(x => x.date === (a.date === b.date ? a.date : date)) || c;
      pinch = { date: target.date, startDist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), startZoom: target.zoom || 1 };
      drag = null;
    } else {
      drag = { id: e.pointerId, date, startX: e.clientX, startY: e.clientY, startFX: c.focalX, startFY: c.focalY };
    }
    try{ strip.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });

  strip.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId); if(p){ p.x = e.clientX; p.y = e.clientY; }
    if(pinch && pointers.size >= 2){
      const pts = [...pointers.values()], a = pts[0], b = pts[1];
      const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const c = compareCustom.find(x => x.date === pinch.date);
      if(c){ 
        c.zoom = Math.max(1, Math.min(3.5, pinch.startZoom * (dist / pinch.startDist))); 
        updateImage(c); 
      }
      e.preventDefault(); return;
    }
    if(!drag || drag.id !== e.pointerId) return;
    const c = compareCustom.find(x => x.date === drag.date); if(!c) return;
    const item = strip.querySelector(`[data-strip="${drag.date}"]`); if(!item) return;
    const rect = item.getBoundingClientRect();
    
    c.focalX = Math.max(0, Math.min(1, drag.startFX - (e.clientX - drag.startX) / Math.max(1, rect.width)));
    c.focalY = Math.max(0, Math.min(1, drag.startFY - (e.clientY - drag.startY) / Math.max(1, rect.height)));
    
    updateImage(c); 
    e.preventDefault();
  });

  const endPointer = e => {
    pointers.delete(e.pointerId); 
    if(pointers.size < 2) pinch = null; 
    if(drag?.id === e.pointerId) drag = null;
  };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => strip.addEventListener(ev, endPointer));

  document.getElementById('cust-gen-btn').onclick = async () => {
    const btn = document.getElementById('cust-gen-btn'); 
    btn.disabled = true; 
    btn.textContent = '生成中…';
    try{
      const entries = compareCustom.map(c => {
        const m = meta.find(x => x.date === c.date);
        return { date: c.date, note: m ? m.note : '', photo: c.photo, focalX: c.focalX, focalY: c.focalY, zoom: c.zoom || 1 };
      });
      const image = await generateComparison(proj.name, entries, compareCustom.orientation, compareCustom.ratio);

      // 生成结果后保留当前拼图调整状态，返回时可以继续调整。
      const customizeState = {
        orientation: compareCustom.orientation || 'horizontal',
        ratio: compareCustom.ratio ?? 0.62,
        activeDate: compareCustom.activeDate || compareCustom[0]?.date || null,
        items: compareCustom.map(c => ({
          date: c.date,
          focalX: c.focalX ?? 0.5,
          focalY: c.focalY ?? 0.5,
          zoom: c.zoom || 1
        }))
      };

      view = {
        name: 'compareResult',
        id: proj.id,
        image,
        orientation: compareCustom.orientation,
        customizeState
      };
      compareMode = false;
      selected = new Set();
      render();
    }catch(e){
      showToast('生成失败：' + e.message); 
      btn.disabled = false; 
      btn.textContent = '生成对照图';
    }
  };
}

/* SYNC_COLLAGE_RENDERER_START */
(function(){
  // One source of truth for collage geometry. Preview and export both call this.
  window.SyncCollage = {
    normalize(items, direction, gap, ratio){
      const arr = (items || []).map((it,i)=>({
        src: it.src || it.url || it.image || "",
        scale: Number.isFinite(+it.scale) ? +it.scale : 1,
        x: Number.isFinite(+it.x) ? +it.x : 0,
        y: Number.isFinite(+it.y) ? +it.y : 0,
        order: Number.isFinite(+it.order) ? +it.order : i
      })).filter(x=>x.src);
      return {items:arr, direction:direction==="vertical"?"vertical":"horizontal",
              gap:Math.max(0,+gap||0), ratio:ratio||"auto"};
    },

    async load(src){
      return new Promise((resolve,reject)=>{
        const im=new Image();
        im.onload=()=>resolve(im);
        im.onerror=reject;
        im.src=src;
      });
    },

    async layout(state, boxW){
      const W=Math.max(1, Math.round(boxW||720));
      const gap=state.gap;
      const imgs=await Promise.all(state.items.map(x=>this.load(x.src)));
      const ratio = state.ratio;
      let H;
      // The preview defines the cell geometry as:
      // horizontal: cellW = availableW / n, cellH = cellW * ratio
      // vertical:   cellW = availableW,     cellH = cellW * ratio
      // Export must use exactly the same relationship.
      const n = Math.max(1, imgs.length);
      const cellW = state.direction==="horizontal"
        ? (W-gap*(n-1))/n
        : W;
      const cellH = ratio && ratio!=="auto"
        ? cellW * (typeof ratio==="number" ? ratio : 0.62)
        : (state.direction==="vertical"
            ? Math.max(1, W/n)
            : Math.max(...imgs.map(im=>cellW*im.naturalHeight/im.naturalWidth)));
      const tileW = cellW;
      const tileH = cellH;
      H = state.direction==="vertical"
        ? tileH*n + gap*(n-1)
        : tileH;

      return {W,H,tileW,tileH,gap,imgs};
    },

    draw(ctx, state, L){
      ctx.clearRect(0,0,L.W,L.H);
      ctx.fillStyle="#f0efea";
      ctx.fillRect(0,0,L.W,L.H);

      state.items.forEach((item,i)=>{
        const im=L.imgs[i];
        let x,y,w,h;
        if(state.direction==="horizontal"){
          x=i*(L.tileW+L.gap); y=0; w=L.tileW; h=L.tileH;
        }else{
          x=0; y=i*(L.tileH+L.gap); w=L.tileW; h=L.tileH;
        }

        ctx.save();
        ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();

        // IMPORTANT: use the exact same transform semantics as preview:
        // scale around tile center, then translate by x/y percentages.
        const scale=Math.max(.1,item.scale||1);
        const iw=im.naturalWidth, ih=im.naturalHeight;
        const cover=Math.max(w/iw,h/ih);
        const dw=iw*cover*scale, dh=ih*cover*scale;
        const dx=x+(w-dw)/2 + (item.x||0)*w;
        const dy=y+(h-dh)/2 + (item.y||0)*h;
        ctx.drawImage(im,dx,dy,dw,dh);
        ctx.restore();
      });
    },

    async export(state, boxW){
      const L=await this.layout(state,boxW);
      const dpr=2;
      const c=document.createElement("canvas");
      c.width=Math.round(L.W*dpr); c.height=Math.round(L.H*dpr);
      const ctx=c.getContext("2d");
      ctx.scale(dpr,dpr);
      this.draw(ctx,state,L);
      return c.toDataURL("image/jpeg",.94);
    }
  };
})();
/* SYNC_COLLAGE_RENDERER_END */

</script>

<script id="sync-collage-final-patch">
(function(){
  function q(sel){return document.querySelector(sel)}
  function getState(){
    // Read the currently rendered collage state from the app's commonly used globals.
    const g=window;
    const candidates=[
      g.customCollageState,g.collageState,g.customState,g.currentCollage,
      g.currentCollageState,g.customPuzzleState
    ];
    let st=candidates.find(x=>x && Array.isArray(x.items));
    if(st) return SyncCollage.normalize(st.items,st.direction,st.gap,st.ratio);

    // DOM fallback: preview tiles themselves become the source of truth.
    const root=q(".cust-strip") || q(".custom-strip") || q("[data-collage]");
    if(root){
      const tiles=[...root.querySelectorAll(".strip-item")];
      const items=tiles.map(t=>{
        const im=t.querySelector("img");
        const cs=im?getComputedStyle(im):null;
        const tr=cs?cs.transform:"none";
        return {src:im?.currentSrc||im?.src||"",
          scale:1,x:0,y:0,transform:tr};
      }).filter(x=>x.src);
      return SyncCollage.normalize(items,
        root.classList.contains("vertical")?"vertical":"horizontal",0,"auto");
    }
    return null;
  }

  // Expose a single final renderer for existing code to call.
  window.renderCollageExactly = async function(){
    const state=getState();
    if(!state || !state.items.length) return null;
    const root=q(".cust-preview-stage")||q(".cust-preview-wrap")||q(".cust-strip");
    const w=root ? Math.max(320, Math.round(root.clientWidth||720)) : 720;
    const data=await SyncCollage.export(state,w);
    window.__lastExactCollageData=data;
    return data;
  };

  // If the app has an export button, make it use the exact renderer.
  document.addEventListener("click", async function(e){
    const b=e.target.closest("button");
    if(!b) return;
    const txt=(b.textContent||"").trim();
    if(!/生成|导出|保存.*对照|下载.*对照/.test(txt)) return;
    // Don't block the original handler; after its current state settles, refresh result.
    setTimeout(async()=>{
      try{
        const data=await window.renderCollageExactly();
        if(!data) return;
        const imgs=[...document.querySelectorAll("img")];
        const result=imgs.find(im=>im.closest(".compare-result")||im.closest("#result"));
        if(result) result.src=data;
        const a=[...document.querySelectorAll("a")].find(x=>/下载|保存/.test(x.textContent||""));
        if(a){a.href=data;a.download="对照图.jpg";}
      }catch(err){console.warn("exact collage render failed",err)}
    },80);
  },true);

  // Keep a result visually identical whenever the preview changes.
  let timer=0;
  const mo=new MutationObserver(()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>window.renderCollageExactly().catch(()=>{}),120);
  });
  mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["style","class"]});
})();
</script>
