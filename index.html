<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>变化日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EA;
    --surface:#FFFFFF;
    --surface-alt:#F7F8F4;
    --ink:#23291F;
    --ink-soft:#5B6357;
    --ink-faint:#8A9184;
    --accent:#3E6B5C;
    --accent-dark:#2C4F44;
    --accent-soft:#DCE8E1;
    --danger:#B5502E;
    --border:#DEDFD6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 16px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  header.topbar .back{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    color:var(--ink);
    flex-shrink:0;
  }
  header.topbar h1{
    font-family:'Source Serif 4',Georgia,serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  header.topbar .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  main{padding:0 20px 100px;}

  /* ---- Home / project list ---- */
  .empty-state{
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:38px;margin-bottom:14px;}
  .empty-state p{font-size:15px;line-height:1.6;margin:0;}

  .project-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .project-card:active{transform:scale(0.98);}
  .project-card .icon{
    width:48px;height:48px;
    border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
  }
  .project-card .info{flex:1;min-width:0;}
  .project-card .info .name{
    font-weight:600;
    font-size:16px;
    margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .project-card .info .meta{
    font-size:13px;
    color:var(--ink-soft);
  }
  .project-card .del{
    color:var(--ink-faint);
    font-size:13px;
    padding:6px 8px;
    flex-shrink:0;
  }
  .project-card .edit{
    color:var(--ink-soft);
    font-size:13px;
    padding:6px 8px;
    flex-shrink:0;
  }

  .fab{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    max-width:420px;
    width:calc(100% - 40px);
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(44,79,68,0.25);
    z-index:20;
  }
  .fab:active{background:var(--accent-dark);}
  .fab.secondary{
    background:var(--surface);
    color:var(--accent-dark);
    border:1.5px solid var(--accent);
    box-shadow:none;
  }
  .fab-row{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    max-width:420px;
    width:calc(100% - 40px);
    display:flex;
    gap:10px;
    z-index:20;
  }
  .fab-row .fab{position:static;transform:none;width:auto;flex:1;}

  /* ---- Timeline (project detail) ---- */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .chip-btn{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .chip-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .entry-row{
    display:flex;
    gap:14px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
    margin-bottom:10px;
  }
  .entry-row .thumb{
    width:64px;height:80px;
    border-radius:10px;
    object-fit:cover;
    background:var(--surface-alt);
    flex-shrink:0;
  }
  .entry-row .info{flex:1;min-width:0;}
  .entry-row .date{font-weight:600;font-size:14.5px;}
  .entry-row .note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .entry-row .check{
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid var(--border);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-size:13px;
  }
  .entry-row .check.checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .entry-row .del-x{
    color:var(--ink-faint);
    font-size:18px;
    padding:4px 6px;
    flex-shrink:0;
  }
  .entry-row .edit-x{
    color:var(--ink-soft);
    font-size:13px;
    padding:4px 6px;
    flex-shrink:0;
    pointer-events:none;
  }
  .entry-row.clickable{cursor:pointer;}

  .select-bar{
    position:fixed;
    left:50%;bottom:28px;
    transform:translateX(-50%);
    max-width:420px;width:calc(100% - 40px);
    background:var(--ink);
    color:#fff;
    border-radius:16px;
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .select-bar span{font-size:13.5px;color:#D8DDD4;}
  .select-bar button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
  }
  .select-bar button:disabled{background:#4B5049;color:#8C9186;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,24,18,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%;max-width:460px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:22px 20px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Source Serif 4',Georgia,serif;
    font-size:20px;
    margin:0 0 18px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 13px;
    font-family:inherit;
    font-size:15px;
    background:var(--surface-alt);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .emoji-row{display:flex;gap:8px;flex-wrap:wrap;}
  .emoji-row button{
    width:44px;height:44px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface-alt);
    font-size:20px;
    cursor:pointer;
  }
  .emoji-row button.sel{border-color:var(--accent);background:var(--accent-soft);}

  .photo-picker{
    border:1.5px dashed var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    background:var(--surface-alt);
  }
  .photo-picker img{
    max-width:100%;
    max-height:280px;
    border-radius:10px;
    display:block;
    margin:0 auto;
  }
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:12px;
    font-family:inherit;
    font-weight:600;
    font-size:14.5px;
    border:none;
    cursor:pointer;
  }
  .sheet-actions .cancel{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}
  .sheet-actions .save{background:var(--accent);color:#fff;}
  .sheet-actions .save:disabled{background:#B9C4BB;color:#fff;}

  .compare-result img{width:100%;border-radius:12px;display:block;}

  /* ---- Crop tool (freeform selection over full photo) ---- */
  #crop-stage{
    position:relative;
    margin:0 auto 14px;
    border-radius:14px;
    overflow:hidden;
    background:#14150F;
    touch-action:none;
  }
  #crop-img{
    position:absolute;
    top:0;left:0;
    transform-origin:top left;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  #crop-box{
    position:absolute;
    box-shadow:0 0 0 2000px rgba(10,12,8,0.6);
    border:1.5px solid #fff;
    box-sizing:border-box;
    touch-action:none;
  }
  #crop-box::before, #crop-box::after{
    content:'';
    position:absolute;
    background:rgba(255,255,255,0.35);
  }
  #crop-box::before{ left:33.33%;right:33.33%;top:0;bottom:0;width:1px; }
  #crop-box::after{ top:33.33%;bottom:33.33%;left:0;right:0;height:1px; }
  .crop-handle{
    position:absolute;
    width:22px;height:22px;
    margin:-11px;
    touch-action:none;
  }
  .crop-handle::after{
    content:'';
    position:absolute;
    top:6px;left:6px;right:6px;bottom:6px;
    background:#fff;
    border-radius:3px;
  }
  .crop-handle.nw{top:0;left:0;cursor:nwse-resize;}
  .crop-handle.ne{top:0;right:0;cursor:nesw-resize;transform:translateX(100%);}
  .crop-handle.sw{bottom:0;left:0;cursor:nesw-resize;transform:translateY(100%);}
  .crop-handle.se{bottom:0;right:0;cursor:nwse-resize;transform:translate(100%,100%);}
  .ratio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .ratio-row button{
    padding:8px 12px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface-alt);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .ratio-row button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}

  /* ---- Compare customize ---- */
  .orientation-row{display:flex;gap:8px;margin:0 0 14px;}
  .orientation-btn{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;}
  .orientation-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .global-size{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;margin-bottom:14px;}
  .global-size-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;}
  .global-size-head label{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .global-size-head strong{font-size:13px;color:var(--ink);}
  .global-size input[type=range]{width:100%;}
  .touch-hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;line-height:1.45;}
  .cust-preview-wrap{width:100%;overflow:hidden;border-radius:16px;margin-bottom:14px;background:var(--surface-alt);}
  .cust-strip{display:flex;width:100%;aspect-ratio:1.6129;height:auto;border-radius:16px;overflow:hidden;background:var(--surface-alt);border:1px solid var(--border);touch-action:none;user-select:none;}
  .cust-strip.vertical{aspect-ratio:.62;height:auto;display:flex;flex-direction:column;}
  .cust-strip .strip-item{overflow:hidden;position:relative;min-width:0;min-height:0;flex:1 1 0;touch-action:none;background:#E4E7DF;}
  .cust-strip .strip-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;transform-origin:center center;}
  .cust-strip .strip-item.active-item{outline:3px solid var(--accent);outline-offset:-3px;z-index:2;}
  .cust-strip .strip-item::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 70%,rgba(15,17,12,.22));opacity:0;transition:opacity .15s;}
  .cust-strip .strip-item.active-item::after{opacity:1;}
  .cust-item{display:none;}
  .compare-result{width:100%;overflow-x:auto;overflow-y:auto;border-radius:16px;background:var(--surface-alt);border:1px solid var(--border);padding:8px;-webkit-overflow-scrolling:touch;}
  .compare-result img{display:block;width:100%;max-width:100%;height:auto;border-radius:10px;margin:0 auto;}
  .result-actions{display:flex;gap:10px;margin-top:14px;width:100%;}
  .result-action-btn{flex:1;min-width:0;padding:14px 10px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--accent-dark);font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer;}
  .result-action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:12px;font-size:13.5px;
    z-index:100;
  }
</style>

<body>
<div class="app" id="app"></div>

<script>
let projects = [];
let view = { name: 'home' };           // {name:'home'} | {name:'project', id} | {name:'compareResult', id, image}
let compareMode = false;
let selected = new Set();
let modal = null;                       // {type:'newProject'} | {type:'editProject', id} | {type:'addEntry', projectId} | {type:'cropPhoto', projectId, rawDataUrl} | {type:'confirmDeleteProject', id} etc
let toastTimer = null;
let entryDraft = { date: null, note: '', photo: null, editingDate: null }; // in-progress add/edit-entry form, survives the crop step
let compareCustom = [];                 // [{date, weight, focalX}] per-photo width/exposed-range settings for the current comparison
const CROP_OUT_MAX = 1400; // longest edge (px) for a saved/cropped photo

function fmtDate(d){
  const [y,m,day] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(day)}日`;
}
function fmtDateShort(d){
  const [y,m,day] = d.split('-');
  return `${y}-${m}-${day}`;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display='block';
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 1800);
}

/* ---- IndexedDB storage (works when this file is opened directly in a browser) ---- */
const DB_NAME = 'change-diary-db';
const STORE = 'kv';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('此浏览器不支持本地存储')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function loadProjects(){
  try{
    const r = await idbGet('projects');
    projects = r || [];
  }catch(e){ projects = []; showToast('本地存储不可用：' + e.message); }
}
async function saveProjects(){
  await idbSet('projects', projects);
}
async function loadMeta(projectId){
  try{
    const list = await idbGet('meta:'+projectId);
    return (list || []).sort((a,b)=> b.date.localeCompare(a.date));
  }catch(e){ return []; }
}
async function saveMeta(projectId, list){
  await idbSet('meta:'+projectId, list);
}
async function savePhoto(projectId, date, dataUrl){
  await idbSet('photo:'+projectId+':'+date, dataUrl);
}
async function loadPhoto(projectId, date){
  try{
    const r = await idbGet('photo:'+projectId+':'+date);
    return r || null;
  }catch(e){ return null; }
}
async function deletePhoto(projectId, date){
  try{ await idbDelete('photo:'+projectId+':'+date); }catch(e){}
}

function compressImage(file, maxDim=1000, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImg(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLtoBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/png';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new Blob([bytes], { type: mime });
}

/* ---- Best-effort EXIF "date taken" reader (JPEG only; silently returns null otherwise) ---- */
function getStringFromView(view, start, length){
  let s = '';
  for(let i=0;i<length;i++){ s += String.fromCharCode(view.getUint8(start+i)); }
  return s;
}
function readTiffTags(view, tiffStart, dirStart, little){
  const tags = {};
  if(dirStart + 2 > view.byteLength) return tags;
  const entries = view.getUint16(dirStart, little);
  for(let i=0;i<entries;i++){
    const entryOffset = dirStart + 2 + i*12;
    if(entryOffset + 12 > view.byteLength) break;
    const tag = view.getUint16(entryOffset, little);
    const type = view.getUint16(entryOffset+2, little);
    const count = view.getUint32(entryOffset+4, little);
    const valueOffset = entryOffset+8;
    if(type === 2){
      let strOffset = valueOffset;
      if(count > 4){ strOffset = tiffStart + view.getUint32(valueOffset, little); }
      if(strOffset + count <= view.byteLength){
        tags[tag] = getStringFromView(view, strOffset, Math.max(0,count-1));
      }
    } else if(type === 4){
      tags[tag] = view.getUint32(valueOffset, little);
    } else if(type === 3){
      tags[tag] = view.getUint16(valueOffset, little);
    }
  }
  return tags;
}
function extractExifDate(buffer){
  try{
    const view = new DataView(buffer);
    if(view.getUint16(0) !== 0xFFD8) return null; // not a JPEG
    let offset = 2;
    const length = view.byteLength;
    while(offset + 4 <= length){
      if(view.getUint8(offset) !== 0xFF) break;
      const marker = view.getUint8(offset+1);
      if(marker === 0xE1){
        const segStart = offset + 4;
        if(getStringFromView(view, segStart, 4) === 'Exif'){
          const tiffStart = segStart + 6;
          const little = view.getUint16(tiffStart) === 0x4949;
          const ifd0Offset = view.getUint32(tiffStart+4, little);
          const tags = readTiffTags(view, tiffStart, tiffStart+ifd0Offset, little);
          let dateStr = null;
          if(tags[0x8769] !== undefined){
            const exifTags = readTiffTags(view, tiffStart, tiffStart+tags[0x8769], little);
            dateStr = exifTags[0x9003] || exifTags[0x9004] || null;
          }
          if(!dateStr) dateStr = tags[0x0132] || null;
          if(dateStr){
            const m = dateStr.match(/^(\d{4}):(\d{2}):(\d{2})/);
            if(m) return `${m[1]}-${m[2]}-${m[3]}`;
          }
        }
        return null;
      } else if(marker === 0xD8 || (marker >= 0xD0 && marker <= 0xD9) || marker === 0x01){
        offset += 2;
      } else {
        const segLen = view.getUint16(offset+2);
        offset += 2 + segLen;
      }
    }
    return null;
  }catch(e){ return null; }
}
function readExifDate(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e) => resolve(extractExifDate(e.target.result));
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 262144));
  });
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth, maxLines){
  if(!text) return [];
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line.length>0){
      lines.push(line);
      line = chars[i];
      if(lines.length === maxLines) break;
    } else {
      line = test;
    }
  }
  if(lines.length < maxLines && line){ lines.push(line); }
  if(lines.length === maxLines){
    let last = lines[maxLines-1];
    while(ctx.measureText(last+'…').width > maxWidth && last.length>1){
      last = last.slice(0,-1);
    }
    if(Array.from(text).length > lines.join('').length){
      lines[maxLines-1] = last + '…';
    }
  }
  return lines;
}

// entries: [{date, note, photo, weight, focalX}]
// weight   - relative display-width multiplier for this photo (1 = its natural "cover" width at ROW_H)
// focalX   - 0..1, which part of the photo's width stays visible when it's narrower than its natural cover width
async function generateComparison(projectName, entries, orientation='horizontal', globalSize=460){
  // Logical size follows the preview exactly; a high-DPI backing canvas keeps photos and text sharp.
  const TITLE_H = 72, PAD = 22, RADIUS = 18;
  const SIZE = Math.max(280, Math.round(globalSize));
  const ratio = 0.62;
  const imgs = await Promise.all(entries.map(e => e.photo ? loadImg(e.photo) : Promise.resolve(null)));
  const n = Math.max(1, entries.length);
  let width, height;
  if(orientation === 'horizontal'){
    width = SIZE;
    height = Math.max(240, Math.round(width * ratio));
  }else{
    height = SIZE;
    width = Math.max(240, Math.round(height * ratio));
  }

  const dpr = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  const logicalW = width;
  const logicalH = height + TITLE_H + PAD;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(logicalW * dpr);
  canvas.height = Math.round(logicalH * dpr);
  canvas.style.width = logicalW + 'px';
  canvas.style.height = logicalH + 'px';
  const ctx = canvas.getContext('2d', {alpha:false});
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.fillStyle = '#F7F8F4';
  ctx.fillRect(0,0,logicalW,logicalH);
  ctx.fillStyle = '#23291F';
  ctx.font = '600 28px "Source Serif 4", Georgia, serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(projectName + ' · 变化对比', PAD, TITLE_H - 20);

  ctx.save();
  roundRectPath(ctx, 0, TITLE_H, width, height, RADIUS);
  ctx.clip();
  entries.forEach((e,i)=>{
    const img=imgs[i];
    const focalX = e.focalX == null ? .5 : e.focalX;
    const focalY = e.focalY == null ? .5 : e.focalY;
    const zoom = Math.max(1, e.zoom || 1);
    let x=0,y=0,w=width,h=height;
    if(orientation==='horizontal'){ x=i*(width/n); w=width/n; }
    else { y=i*(height/n); h=height/n; }
    ctx.save();
    ctx.beginPath(); ctx.rect(x,y+TITLE_H,w,h); ctx.clip();
    if(img){
      const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight) * zoom;
      const dw=img.naturalWidth*scale, dh=img.naturalHeight*scale;
      let dx=x+w/2-focalX*dw, dy=y+TITLE_H+h/2-focalY*dh;
      dx=Math.min(x,Math.max(x+w-dw,dx));
      dy=Math.min(y+TITLE_H,Math.max(y+TITLE_H+h-dh,dy));
      ctx.drawImage(img,dx,dy,dw,dh);
    }else{
      ctx.fillStyle='#E4E7DF'; ctx.fillRect(x,y+TITLE_H,w,h);
    }
    const grad=orientation==='horizontal'
      ? ctx.createLinearGradient(0,y+TITLE_H+h*.58,0,y+TITLE_H+h)
      : ctx.createLinearGradient(x+w*.58,0,x+w,0);
    grad.addColorStop(0,'rgba(15,17,12,0)'); grad.addColorStop(1,'rgba(15,17,12,.72)');
    ctx.fillStyle=grad;
    if(orientation==='horizontal') ctx.fillRect(x,y+TITLE_H+h*.52,w,h*.48);
    else ctx.fillRect(x+w*.52,y+TITLE_H,w*.48,h);
    const pad=16, textW=Math.max(40,w-pad*2);
    ctx.textAlign='left'; ctx.fillStyle='#fff';
    let ty=y+TITLE_H+h-16;
    if(e.note){
      ctx.font='400 16px Inter, sans-serif'; ctx.fillStyle='rgba(255,255,255,.96)';
      const lines=wrapText(ctx,e.note,textW,2);
      for(let li=lines.length-1;li>=0;li--){ctx.fillText(lines[li],x+pad,ty);ty-=22;}
    }
    ctx.font='700 18px Inter, sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText(fmtDateShort(e.date),x+pad,ty);
    ctx.restore();
    if(i<n-1){
      ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.5; ctx.beginPath();
      if(orientation==='horizontal'){ctx.moveTo(x+w,y+TITLE_H);ctx.lineTo(x+w,y+TITLE_H+h);}
      else{ctx.moveTo(x,y+TITLE_H+h);ctx.lineTo(x+w,y+TITLE_H+h);}
      ctx.stroke();
    }
  });
  ctx.restore();
  return canvas.toDataURL('image/png');
}

/* ---------------- Rendering ---------------- */

async function render(){
  const app = document.getElementById('app');
  if(view.name === 'home'){
    app.innerHTML = renderHome();
    bindHome();
  } else if(view.name === 'project'){
    const proj = projects.find(p=>p.id===view.id);
    const meta = await loadMeta(view.id);
    app.innerHTML = renderProject(proj, meta);
    bindProject(proj, meta);
  } else if(view.name === 'compareCustomize'){
    const proj = projects.find(p=>p.id===view.id);
    const meta = await loadMeta(view.id);
    app.innerHTML = renderCompareCustomize(proj, meta);
    await bindCompareCustomize(proj, meta);
  } else if(view.name === 'compareResult'){
    app.innerHTML = renderCompareResult();
    bindCompareResult();
  }
  if(modal){ renderModal(); } else { const m = document.getElementById('modal-root'); if(m) m.remove(); }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

          existing.icon = icon;

          modal = null;

        saveBtn.textContent = isEdit ? '保存' : '创建';
      }
    };
  }

    const isEdit = !!entryDraft.editingDate;

        <div class="sheet">

          </div>

            </div>

          </div>
        </div>
      </div>
    `;

    const handleFile = async (file) => {

      showToast('正在读取照片信息…');
      try{

        if(exifDate){ entryDraft.date = exifDate; entryDraft.dateFromExif = true; }

      { key:'3:4',  label:'3:4', v:3/4 },
      { key:'4:3',  label:'4:3', v:4/3 },
      { key:'9:16', label:'9:16', v:9/16 },
    ];
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>裁剪照片</h2>
          <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px;">拖动四角可以裁切范围，拖动框内可以移动，用滑块可以放大照片看得更细。尽量让每次拍摄的角度和范围保持一致，对比会更清楚。</p>
          <div id="crop-stage" style="width:${VW}px;height:${VH}px;">
            <img id="crop-img" draggable="false">
            <div id="crop-box">
              <div class="crop-handle nw" data-corner="nw"></div>
              <div class="crop-handle ne" data-corner="ne"></div>
              <div class="crop-handle sw" data-corner="sw"></div>
              <div class="crop-handle se" data-corner="se"></div>
            </div>
          </div>
          <div class="field">
            <label>缩放（放大照片以便精细裁剪）</label>
            <input type="range" id="crop-zoom" min="1" max="2.5" step="0.01" value="1" style="width:100%;">
          </div>
          <div class="field">
            <label>裁剪比例</label>
            <div class="ratio-row">
              ${RATIOS.map(r=>`<button type="button" data-ratio="${r.key}" class="${r.key==='orig'?'sel':''}">${r.label}</button>`).join('')}
            </div>
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="crop-cancel">取消</button>
            <button class="save" id="crop-confirm">完成</button>
          </div>
        </div>
      </div>
    `;
    const stage = root.querySelector('#crop-stage');
    const imgEl = root.querySelector('#crop-img');
    const boxEl = root.querySelector('#crop-box');
    const zoomSlider = root.querySelector('#crop-zoom');

    let natW=0, natH=0, scale0=1, z=1, panX=0, panY=0;
    let box = { x:0, y:0, w:VW, h:VH };
    let ratioKey = 'orig', aspectValue = null; // aspectValue null => free

    function imageRect(){
      const scale = scale0*z;
      const iw = natW*scale, ih = natH*scale;
      const ix = (VW-iw)/2 + panX, iy = (VH-ih)/2 + panY;
      return { ix, iy, iw, ih, scale };
    }
    function clampPan(){
      const scale = scale0*z;
      const iw = natW*scale, ih = natH*scale;
      const maxPanX = Math.max(0, (iw-VW)/2 + 60);
      const maxPanY = Math.max(0, (ih-VH)/2 + 60);
      panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
      panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
    }
    function clampBox(){
      const r = imageRect();
      box.w = Math.min(box.w, r.iw);
      box.h = Math.min(box.h, r.ih);
      box.x = Math.min(Math.max(box.x, r.ix), r.ix + r.iw - box.w);
      box.y = Math.min(Math.max(box.y, r.iy), r.iy + r.ih - box.h);
    }
    function applyRatio(){
      if(!natW) return;
      const aspect = ratioKey==='orig' ? (natW/natH) : aspectValue;
      if(aspect == null) return; // free: leave box as-is
      const cx = box.x+box.w/2, cy = box.y+box.h/2;
      const r = imageRect();
      let w = Math.min(box.w, r.iw), h = w/aspect;
      if(h > r.ih){ h = r.ih; w = h*aspect; }
      if(w > r.iw){ w = r.iw; h = w/aspect; }
      box = { x: cx-w/2, y: cy-h/2, w, h };
      clampBox();
    }
    function paint(){
      const r = imageRect();
      imgEl.style.width = r.iw+'px'; imgEl.style.height = r.ih+'px';
      imgEl.style.left = r.ix+'px'; imgEl.style.top = r.iy+'px';
      boxEl.style.left = box.x+'px'; boxEl.style.top = box.y+'px';
      boxEl.style.width = box.w+'px'; boxEl.style.height = box.h+'px';
    }

    loadImg(modal.rawDataUrl).then(img => {
      natW = img.naturalWidth; natH = img.naturalHeight;
      scale0 = Math.min(VW/natW, VH/natH);
      imgEl.src = modal.rawDataUrl;
      const r0 = imageRect();
      box = { x:r0.ix, y:r0.iy, w:r0.iw, h:r0.ih };
      paint();
    });

    root.querySelectorAll('[data-ratio]').forEach(btn=>{
      btn.onclick = () => {
        root.querySelectorAll('[data-ratio]').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        ratioKey = btn.dataset.ratio;
        aspectValue = RATIOS.find(r=>r.key===ratioKey).v || null;
        applyRatio();
        paint();
      };
    });

    zoomSlider.oninput = () => {
      if(!natW) return;
      z = parseFloat(zoomSlider.value);
      clampPan();
      clampBox();
      paint();
    };

    let mode = null; // 'move' | 'resize' | 'pan'
    let startPX=0, startPY=0, startBox=null, startPan=null, corner=null;

    stage.addEventListener('pointerdown', (e) => {
      if(!natW) return;
      startPX = e.clientX; startPY = e.clientY;
      const target = e.target;
      if(target.classList.contains('crop-handle')){
        mode = 'resize'; corner = target.dataset.corner; startBox = {...box};
      } else if(target === boxEl){
        mode = 'move'; startBox = {...box};
      } else {
        mode = 'pan'; startPan = { x:panX, y:panY };
      }
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    stage.addEventListener('pointermove', (e) => {
      if(!mode || !natW) return;
      const dx = e.clientX - startPX, dy = e.clientY - startPY;
      if(mode === 'pan'){
        panX = startPan.x + dx; panY = startPan.y + dy;
        clampPan();
        clampBox();
      } else if(mode === 'move'){
        box = { x:startBox.x+dx, y:startBox.y+dy, w:startBox.w, h:startBox.h };
        clampBox();
      } else if(mode === 'resize'){
        const locked = ratioKey !== 'free';
        const aspect = ratioKey==='orig' ? (natW/natH) : (aspectValue || (startBox.w/startBox.h));
        let {x,y,w,h} = startBox;
        if(corner==='se'){ w = startBox.w+dx; h = locked ? w/aspect : startBox.h+dy; }
        else if(corner==='nw'){ w = startBox.w-dx; h = locked ? w/aspect : startBox.h-dy; x = startBox.x+startBox.w-w; y = startBox.y+startBox.h-h; }
        else if(corner==='ne'){ w = startBox.w+dx; h = locked ? w/aspect : startBox.h-dy; y = startBox.y+startBox.h-h; }
        else if(corner==='sw'){ w = startBox.w-dx; h = locked ? w/aspect : startBox.h+dy; x = startBox.x+startBox.w-w; }
        w = Math.max(48, w); h = Math.max(48, h);
        box = { x, y, w, h };
        clampBox();
      }
      paint();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(evt => stage.addEventListener(evt, () => { mode = null; }));

    const closeToEdit = () => { modal = { type:'addEntry', projectId: modal.projectId }; render(); };
    root.querySelector('#crop-cancel').onclick = closeToEdit;
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay') closeToEdit(); };
    root.querySelector('#crop-confirm').onclick = async () => {
      const confirmBtn = root.querySelector('#crop-confirm');
      confirmBtn.disabled = true; confirmBtn.textContent = '处理中…';
      try{
        const img = await loadImg(modal.rawDataUrl);
        const r = imageRect();
        const sx = Math.max(0, Math.min(natW-1, (box.x - r.ix)/r.scale));
        const sy = Math.max(0, Math.min(natH-1, (box.y - r.iy)/r.scale));
        const sw = Math.max(1, Math.min(natW-sx, box.w/r.scale));
        const sh = Math.max(1, Math.min(natH-sy, box.h/r.scale));
        let outW = sw, outH = sh;
        if(Math.max(outW,outH) > CROP_OUT_MAX){
          const s = CROP_OUT_MAX/Math.max(outW,outH);
          outW *= s; outH *= s;
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(outW); canvas.height = Math.round(outH);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        entryDraft.photo = canvas.toDataURL('image/jpeg', 0.9);
        closeToEdit();
      }catch(e){
        showToast('裁剪失败，请重试');
        confirmBtn.disabled = false; confirmBtn.textContent = '完成';
      }
    };
  }

  if(modal.type === 'confirmDeleteProject'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>删除项目</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">此项目下的所有照片和记录都会被删除，且无法恢复。确定要删除吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="cd-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="cd-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#cd-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#cd-confirm').onclick = async () => {
      const id = modal.id;
      const meta = await loadMeta(id);
      for(const e of meta){ await deletePhoto(id, e.date); }
      try{ await idbDelete('meta:'+id); }catch(e){}
      projects = projects.filter(p=>p.id!==id);
      await saveProjects();
      modal = null;
      view = { name:'home' };
      render();
    };
  }

  if(modal.type === 'confirmDeleteEntry'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>删除这条记录</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">${fmtDate(modal.date)} 的照片和备注会被删除。确定吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="ce-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="ce-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#ce-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#ce-confirm').onclick = async () => {
      const { projectId, date } = modal;
      let meta = await loadMeta(projectId);
      meta = meta.filter(m=>m.date!==date);
      await saveMeta(projectId, meta);
      await deletePhoto(projectId, date);
      const proj = projects.find(p=>p.id===projectId);
      proj.count = meta.length;
      proj.lastDate = meta.length ? meta.reduce((a,b)=> a>b.date?a:b.date, meta[0].date) : null;
      await saveProjects();
      selected.delete(date);
      modal = null;
      render();
    };
  }
}

/* ---------------- Bindings ---------------- */

function bindHome(){
  document.getElementById('new-project-btn').onclick = () => { modal = {type:'newProject'}; render(); };
  document.querySelectorAll('.project-card').forEach(card=>{
    card.addEventListener('click', (e) => {
      if(e.target.dataset.del) return;
      view = { name:'project', id: card.dataset.id };
      compareMode = false; selected = new Set();
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      modal = { type:'confirmDeleteProject', id: el.dataset.del };
      render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      modal = { type:'editProject', id: el.dataset.edit };
      render();
    });
  });
}

function bindProject(proj, meta){
  document.getElementById('back-btn').onclick = () => { view = {name:'home'}; compareMode=false; selected=new Set(); render(); };

  // load thumbnails async
  meta.forEach(async (e) => {
    const photo = await loadPhoto(proj.id, e.date);
    const imgEl = document.querySelector(`[data-thumb="${e.date}"]`);
    if(imgEl && photo) imgEl.src = photo;
  });

  if(compareMode){
    document.getElementById('cancel-compare-btn').onclick = () => { compareMode=false; selected=new Set(); render(); };
    document.querySelectorAll('[data-check]').forEach(el=>{
      el.addEventListener('click', () => {
        const d = el.dataset.check;
        if(selected.has(d)) selected.delete(d);
        else { if(selected.size>=5){ showToast('最多选择 5 个日期'); return; } selected.add(d); }
        render();
      });
    });
    const genBtn = document.getElementById('gen-compare-btn');
    if(genBtn) genBtn.onclick = async () => {
      const dates = Array.from(selected).sort();
      compareCustom = dates.map(d => ({ date: d, focalX: 0.5, focalY: 0.5, zoom: 1 }));
      view = { name:'compareCustomize', id: proj.id };
      render();
    };
  } else {
    const toggleBtn = document.getElementById('toggle-compare-btn');
    if(toggleBtn) toggleBtn.onclick = () => { if(meta.length<2) return; compareMode=true; selected=new Set(); render(); };
    document.getElementById('add-entry-btn').onclick = () => {
      entryDraft = { date: todayStr(), note: '', photo: null, editingDate: null };
      modal = {type:'addEntry', projectId: proj.id};
      render();
    };
    document.querySelectorAll('[data-del-entry]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        modal = { type:'confirmDeleteEntry', projectId: proj.id, date: el.dataset.delEntry };
        render();
      });
    });
    document.querySelectorAll('[data-edit-entry]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        const date = el.dataset.editEntry;
        const m = meta.find(x=>x.date===date);
        if(!m) return;
        const photo = await loadPhoto(proj.id, date);
        entryDraft = { date, note: m.note || '', photo, editingDate: date, dateFromExif:false };
        modal = { type:'addEntry', projectId: proj.id };
        render();
      });
    });
  }
}

async function bindCompareCustomize(proj, meta){
  const strip = document.getElementById('cust-strip');
  const sizeSlider = document.getElementById('global-size');
  const sizeValue = document.getElementById('global-size-value');
  let activeDate = compareCustom[0]?.date || null;

  compareCustom.orientation = compareCustom.orientation || 'horizontal';
  compareCustom.globalSize = compareCustom.globalSize || 460;

  document.getElementById('back-btn').onclick = () => {
    view = { name:'project', id: proj.id }; compareMode = true; render();
  };

  function setActive(date, on=true){
    activeDate = date;
    document.querySelectorAll('.strip-item').forEach(el=>el.classList.toggle('active-item', on && el.dataset.strip===date));
  }

  function updatePreviewLayout(){
    const vertical = compareCustom.orientation === 'vertical';
    strip.classList.toggle('vertical', vertical);
    // Preview uses the exact same aspect ratio as the generated image; the size slider changes the logical output size, not the phone viewport width.
    strip.style.aspectRatio = vertical ? '.62' : '1.6129';
    strip.style.height = 'auto';
    sizeValue.textContent = Math.round(compareCustom.globalSize) + 'px';
  }

  function updateImage(c){
    const img = document.querySelector(`[data-strip-img="${c.date}"]`);
    if(!img) return;
    img.style.objectPosition = `${Math.round((c.focalX ?? .5)*100)}% ${Math.round((c.focalY ?? .5)*100)}%`;
    img.style.transform = `scale(${c.zoom ?? 1})`;
  }

  await Promise.all(compareCustom.map(async c => {
    const photo = await loadPhoto(proj.id, c.date);
    c.photo = photo;
    c.focalX = c.focalX ?? .5;
    c.focalY = c.focalY ?? .5;
    c.zoom = c.zoom ?? 1;
    const img = document.querySelector(`[data-strip-img="${c.date}"]`);
    if(img && photo) img.src = photo;
    updateImage(c);
  }));
  updatePreviewLayout();
  setActive(activeDate, false);

  document.querySelectorAll('[data-orientation]').forEach(btn=>{
    btn.onclick = () => {
      compareCustom.orientation = btn.dataset.orientation;
      document.querySelectorAll('[data-orientation]').forEach(b=>b.classList.toggle('active', b===btn));
      updatePreviewLayout();
    };
  });

  sizeSlider.oninput = () => {
    compareCustom.globalSize = parseFloat(sizeSlider.value);
    updatePreviewLayout();
  };

  // Direct manipulation: one finger drags the selected photo; two fingers pinch-zoom it.
  let drag = null;
  let pinch = null;
  const pointers = new Map();

  strip.addEventListener('pointerdown', e=>{
    const item = e.target.closest('.strip-item');
    if(!item) return;
    const date=item.dataset.strip;
    const c=compareCustom.find(x=>x.date===date); if(!c) return;
    setActive(date, true);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,date});

    if(pointers.size===2){
      const pts=[...pointers.values()];
      const a=pts[0], b=pts[1];
      const sameDate=a.date===b.date ? a.date : date;
      const target=compareCustom.find(x=>x.date===sameDate) || c;
      pinch={date:target.date,startDist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),startZoom:target.zoom||1};
      drag=null;
    }else{
      drag={id:e.pointerId,date,startX:e.clientX,startY:e.clientY,startFX:c.focalX,startFY:c.focalY};
    }
    try{strip.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });

  strip.addEventListener('pointermove', e=>{
    const p=pointers.get(e.pointerId);
    if(p){p.x=e.clientX;p.y=e.clientY;}

    if(pinch && pointers.size>=2){
      const pts=[...pointers.values()];
      const a=pts[0], b=pts[1];
      const dist=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
      const c=compareCustom.find(x=>x.date===pinch.date);
      if(c){
        c.zoom=Math.max(1,Math.min(3.5,pinch.startZoom*(dist/pinch.startDist)));
        updateImage(c);
      }
      e.preventDefault(); return;
    }

    if(!drag || drag.id!==e.pointerId) return;
    const c=compareCustom.find(x=>x.date===drag.date); if(!c) return;
    const item=strip.querySelector(`[data-strip="${drag.date}"]`);
    if(!item) return;
    const rect=item.getBoundingClientRect();
    // Drag feels natural: move the photo in the same direction as the finger.
    const sensitivityX=1/Math.max(1,rect.width);
    const sensitivityY=1/Math.max(1,rect.height);
    c.focalX=Math.max(0,Math.min(1,drag.startFX-(e.clientX-drag.startX)*sensitivityX));
    c.focalY=Math.max(0,Math.min(1,drag.startFY-(e.clientY-drag.startY)*sensitivityY));
    updateImage(c);
    e.preventDefault();
  });

  const endPointer=e=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(drag?.id===e.pointerId) drag=null;
  };
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>strip.addEventListener(ev,endPointer));

  document.getElementById('cust-gen-btn').onclick = async () => {
    const btn=document.getElementById('cust-gen-btn');
    btn.disabled=true; btn.textContent='生成中…';
    try{
      const entries=compareCustom.map(c=>{
        const m=meta.find(x=>x.date===c.date);
        return {date:c.date,note:m?m.note:'',photo:c.photo,focalX:c.focalX,focalY:c.focalY,zoom:c.zoom||1};
      });
      const image=await generateComparison(proj.name,entries,compareCustom.orientation,compareCustom.globalSize);
      view={name:'compareResult',id:proj.id,image,orientation:compareCustom.orientation};
      compareMode=false; selected=new Set(); compareCustom=[]; render();
    }catch(e){
      showToast('生成失败：'+e.message); btn.disabled=false; btn.textContent='生成对比图';
    }
  };
}

function bindCompareResult(){
  document.getElementById('back-btn').onclick = () => { view={name:'project',id:view.id}; render(); };
  document.getElementById('result-back-btn').onclick = () => {
    view={name:'project',id:view.id}; compareMode=false; selected=new Set(); render();
  };
  document.getElementById('share-btn').onclick = async () => {
    try{
      const blob=dataURLtoBlob(view.image);
      const file=new File([blob],`对比图-${Date.now()}.png`,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'对比图'});return;}
      const url=URL.createObjectURL(blob); window.open(url,'_blank'); showToast('已在新标签页打开，长按图片保存');
    }catch(e){ if(e&&e.name==='AbortError')return; showToast('分享失败，请直接长按上方图片保存'); }
  };
}

/* ---------------- Init ---------------- */

(async function init(){
  await loadProjects();
  render();
})();
