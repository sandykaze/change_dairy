<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>变化日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EA;
    --surface:#FFFFFF;
    --surface-alt:#F7F8F4;
    --ink:#23291F;
    --ink-soft:#5B6357;
    --ink-faint:#8A9184;
    --accent:#3E6B5C;
    --accent-dark:#2C4F44;
    --accent-soft:#DCE8E1;
    --danger:#B5502E;
    --border:#DEDFD6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 16px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  header.topbar .back{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    color:var(--ink);
    flex-shrink:0;
  }
  header.topbar h1{
    font-family:'Source Serif 4',Georgia,serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  header.topbar .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  main{padding:0 20px 100px;}

  /* ---- Home / project list ---- */
  .empty-state{
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:38px;margin-bottom:14px;}
  .empty-state p{font-size:15px;line-height:1.6;margin:0;}

  .project-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .project-card:active{transform:scale(0.98);}
  .project-card .icon{
    width:48px;height:48px;
    border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
  }
  .project-card .info{flex:1;min-width:0;}
  .project-card .info .name{
    font-weight:600;
    font-size:16px;
    margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .project-card .info .meta{
    font-size:13px;
    color:var(--ink-soft);
  }
  .project-card .del{
    color:var(--ink-faint);
    font-size:13px;
    padding:6px 8px;
    flex-shrink:0;
  }

  .fab{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    max-width:420px;
    width:calc(100% - 40px);
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(44,79,68,0.25);
    z-index:20;
  }
  .fab:active{background:var(--accent-dark);}
  .fab.secondary{
    background:var(--surface);
    color:var(--accent-dark);
    border:1.5px solid var(--accent);
    box-shadow:none;
  }
  .fab-row{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    max-width:420px;
    width:calc(100% - 40px);
    display:flex;
    gap:10px;
    z-index:20;
  }
  .fab-row .fab{position:static;transform:none;width:auto;flex:1;}

  /* ---- Timeline (project detail) ---- */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .chip-btn{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .chip-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .entry-row{
    display:flex;
    gap:14px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
    margin-bottom:10px;
  }
  .entry-row .thumb{
    width:64px;height:80px;
    border-radius:10px;
    object-fit:cover;
    background:var(--surface-alt);
    flex-shrink:0;
  }
  .entry-row .info{flex:1;min-width:0;}
  .entry-row .date{font-weight:600;font-size:14.5px;}
  .entry-row .note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .entry-row .check{
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid var(--border);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-size:13px;
  }
  .entry-row .check.checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .entry-row .del-x{
    color:var(--ink-faint);
    font-size:18px;
    padding:4px 6px;
    flex-shrink:0;
  }

  .select-bar{
    position:fixed;
    left:50%;bottom:28px;
    transform:translateX(-50%);
    max-width:420px;width:calc(100% - 40px);
    background:var(--ink);
    color:#fff;
    border-radius:16px;
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .select-bar span{font-size:13.5px;color:#D8DDD4;}
  .select-bar button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
  }
  .select-bar button:disabled{background:#4B5049;color:#8C9186;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,24,18,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%;max-width:460px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:22px 20px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Source Serif 4',Georgia,serif;
    font-size:20px;
    margin:0 0 18px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 13px;
    font-family:inherit;
    font-size:15px;
    background:var(--surface-alt);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .emoji-row{display:flex;gap:8px;flex-wrap:wrap;}
  .emoji-row button{
    width:44px;height:44px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface-alt);
    font-size:20px;
    cursor:pointer;
  }
  .emoji-row button.sel{border-color:var(--accent);background:var(--accent-soft);}

  .photo-picker{
    border:1.5px dashed var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    background:var(--surface-alt);
  }
  .photo-picker img{
    max-width:100%;
    max-height:280px;
    border-radius:10px;
    display:block;
    margin:0 auto;
  }
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:12px;
    font-family:inherit;
    font-weight:600;
    font-size:14.5px;
    border:none;
    cursor:pointer;
  }
  .sheet-actions .cancel{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}
  .sheet-actions .save{background:var(--accent);color:#fff;}
  .sheet-actions .save:disabled{background:#B9C4BB;color:#fff;}

  .compare-result img{width:100%;border-radius:12px;display:block;}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:12px;font-size:13.5px;
    z-index:100;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const S = window.storage;
let projects = [];
let view = { name: 'home' };           // {name:'home'} | {name:'project', id} | {name:'compareResult', id, image}
let compareMode = false;
let selected = new Set();
let modal = null;                       // {type:'newProject'} | {type:'addEntry', projectId} | {type:'confirmDeleteProject', id} etc
let toastTimer = null;

function fmtDate(d){
  const [y,m,day] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(day)}日`;
}
function fmtDateShort(d){
  const [y,m,day] = d.split('-');
  return `${y}-${m}-${day}`;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display='block';
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 1800);
}

async function loadProjects(){
  try{
    const r = await S.get('projects');
    projects = r ? JSON.parse(r.value) : [];
  }catch(e){ projects = []; }
}
async function saveProjects(){
  await S.set('projects', JSON.stringify(projects));
}
async function loadMeta(projectId){
  try{
    const r = await S.get('meta:'+projectId);
    const list = r ? JSON.parse(r.value) : [];
    return list.sort((a,b)=> b.date.localeCompare(a.date));
  }catch(e){ return []; }
}
async function saveMeta(projectId, list){
  await S.set('meta:'+projectId, JSON.stringify(list));
}
async function savePhoto(projectId, date, dataUrl){
  await S.set('photo:'+projectId+':'+date, dataUrl);
}
async function loadPhoto(projectId, date){
  try{
    const r = await S.get('photo:'+projectId+':'+date);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function deletePhoto(projectId, date){
  try{ await S.delete('photo:'+projectId+':'+date); }catch(e){}
}

function compressImage(file, maxDim=1000, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImg(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth, maxLines){
  if(!text) return [];
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line.length>0){
      lines.push(line);
      line = chars[i];
      if(lines.length === maxLines) break;
    } else {
      line = test;
    }
  }
  if(lines.length < maxLines && line){ lines.push(line); }
  if(lines.length === maxLines){
    let last = lines[maxLines-1];
    while(ctx.measureText(last+'…').width > maxWidth && last.length>1){
      last = last.slice(0,-1);
    }
    if(Array.from(text).length > lines.join('').length){
      lines[maxLines-1] = last + '…';
    }
  }
  return lines;
}

async function generateComparison(projectName, entries){
  const FRAME_W = 280, FRAME_H = 360, GAP = 22, LABEL_H = 78, TITLE_H = 60, PAD = 22;
  const n = entries.length;
  const width = n*FRAME_W + (n+1)*GAP;
  const height = TITLE_H + FRAME_H + LABEL_H + GAP*2 + PAD;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#F7F8F4';
  ctx.fillRect(0,0,width,height);

  ctx.fillStyle = '#23291F';
  ctx.font = '600 26px "Source Serif 4", Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText(projectName + ' · 变化对比', PAD, TITLE_H - 12);
  ctx.strokeStyle = '#DEDFD6';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, TITLE_H); ctx.lineTo(width-PAD, TITLE_H); ctx.stroke();

  for(let i=0;i<n;i++){
    const e = entries[i];
    const x = GAP + i*(FRAME_W+GAP);
    const y = TITLE_H + GAP;
    ctx.save();
    roundRectPath(ctx, x, y, FRAME_W, FRAME_H, 16);
    ctx.clip();
    ctx.fillStyle = '#E4E7DF';
    ctx.fillRect(x,y,FRAME_W,FRAME_H);
    if(e.photo){
      const img = await loadImg(e.photo);
      const scale = Math.max(FRAME_W/img.width, FRAME_H/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, x + (FRAME_W-dw)/2, y + (FRAME_H-dh)/2, dw, dh);
    }
    ctx.restore();
    ctx.strokeStyle = '#DEDFD6';
    roundRectPath(ctx, x, y, FRAME_W, FRAME_H, 16);
    ctx.stroke();

    const labelY = y + FRAME_H + 26;
    ctx.fillStyle = '#23291F';
    ctx.font = '700 17px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fmtDateShort(e.date), x + FRAME_W/2, labelY);

    if(e.note){
      ctx.fillStyle = '#5B6357';
      ctx.font = '400 13px Inter, sans-serif';
      const lines = wrapText(ctx, e.note, FRAME_W - 20, 2);
      lines.forEach((ln, li) => {
        ctx.fillText(ln, x + FRAME_W/2, labelY + 22 + li*17);
      });
    }
  }
  return canvas.toDataURL('image/png');
}

/* ---------------- Rendering ---------------- */

async function render(){
  const app = document.getElementById('app');
  if(view.name === 'home'){
    app.innerHTML = renderHome();
    bindHome();
  } else if(view.name === 'project'){
    const proj = projects.find(p=>p.id===view.id);
    const meta = await loadMeta(view.id);
    app.innerHTML = renderProject(proj, meta);
    bindProject(proj, meta);
  } else if(view.name === 'compareResult'){
    app.innerHTML = renderCompareResult();
    bindCompareResult();
  }
  if(modal){ renderModal(); } else { const m = document.getElementById('modal-root'); if(m) m.remove(); }
}

function renderHome(){
  let list = '';
  if(projects.length === 0){
    list = `<div class="empty-state">
      <div class="glyph">📔</div>
      <p>还没有项目。<br>新建一个开始记录变化，比如牙齿、脸部或体态。</p>
    </div>`;
  } else {
    list = projects.map(p => `
      <div class="project-card" data-id="${p.id}">
        <div class="icon">${p.icon}</div>
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">${p.lastDate ? '最近记录 ' + fmtDateShort(p.lastDate) : '暂无记录'} · ${p.count||0} 条</div>
        </div>
        <div class="del" data-del="${p.id}">删除</div>
      </div>
    `).join('');
  }
  return `
    <header class="topbar"><h1>变化日记</h1></header>
    <main>${list}</main>
    <button class="fab" id="new-project-btn">＋ 新建项目</button>
  `;
}

function renderProject(proj, meta){
  let rows = '';
  if(meta.length === 0){
    rows = `<div class="empty-state">
      <div class="glyph">${proj.icon}</div>
      <p>还没有记录，点击下方按钮添加第一张照片。</p>
    </div>`;
  } else {
    rows = meta.map(e => `
      <div class="entry-row" data-date="${e.date}">
        ${compareMode ? `<div class="check ${selected.has(e.date)?'checked':''}" data-check="${e.date}">${selected.has(e.date)?'✓':''}</div>` : ''}
        <img class="thumb" data-thumb="${e.date}" src="" alt="">
        <div class="info">
          <div class="date">${fmtDate(e.date)}</div>
          ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
        </div>
        ${!compareMode ? `<div class="del-x" data-del-entry="${e.date}">✕</div>` : ''}
      </div>
    `).join('');
  }

  const bottomBar = compareMode
    ? `<div class="select-bar">
        <span>已选 ${selected.size}/5（至少选 2 个日期）</span>
        <button id="gen-compare-btn" ${selected.size>=2 && selected.size<=5 ? '' : 'disabled'}>生成对比图</button>
       </div>`
    : `<div class="fab-row">
        <button class="fab secondary" id="toggle-compare-btn" ${meta.length<2?'disabled style="opacity:.5"':''}>对比</button>
        <button class="fab" id="add-entry-btn">＋ 记录今天</button>
       </div>`;

  return `
    <header class="topbar">
      <div class="back" id="back-btn">←</div>
      <div style="flex:1;min-width:0;">
        <h1>${escapeHtml(proj.name)}</h1>
      </div>
    </header>
    <main>
      ${compareMode ? `<div class="toolbar"><button class="chip-btn active" id="cancel-compare-btn">取消对比选择</button></div>` : ''}
      ${rows}
    </main>
    ${bottomBar}
  `;
}

function renderCompareResult(){
  return `
    <header class="topbar">
      <div class="back" id="back-btn">←</div>
      <h1>对比图</h1>
    </header>
    <main>
      <div class="compare-result">
        <img src="${view.image}" alt="对比图">
      </div>
      <div class="fab-row" style="position:static;margin-top:20px;width:100%;">
        <a class="fab secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="${view.image}" download="对比图-${Date.now()}.png">下载图片</a>
      </div>
    </main>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Modal rendering ---------------- */

function renderModal(){
  let existing = document.getElementById('modal-root');
  if(existing) existing.remove();
  const root = document.createElement('div');
  root.id = 'modal-root';
  document.body.appendChild(root);

  if(modal.type === 'newProject'){
    const icons = ['📷','🦷','😊','🧍','💪','📝'];
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>新建项目</h2>
          <div class="field">
            <label>项目名称</label>
            <input type="text" id="np-name" placeholder="例如：牙周恢复 / 脸部变化 / 体态">
          </div>
          <div class="field">
            <label>图标</label>
            <div class="emoji-row">
              ${icons.map((ic,i)=>`<button data-icon="${ic}" class="${i===0?'sel':''}">${ic}</button>`).join('')}
            </div>
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="np-cancel">取消</button>
            <button class="save" id="np-save">创建</button>
          </div>
        </div>
      </div>
    `;
    let selIcon = icons[0];
    root.querySelectorAll('[data-icon]').forEach(btn=>{
      btn.onclick = () => {
        root.querySelectorAll('[data-icon]').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        selIcon = btn.dataset.icon;
      };
    });
    root.querySelector('#np-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#np-save').onclick = async () => {
      const name = root.querySelector('#np-name').value.trim();
      if(!name){ showToast('请输入项目名称'); return; }
      const proj = { id: 'proj_'+Date.now(), name, icon: selIcon, createdAt: Date.now(), count:0, lastDate:null };
      projects.unshift(proj);
      await saveProjects();
      modal = null;
      view = { name:'project', id: proj.id };
      render();
    };
  }

  if(modal.type === 'addEntry'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>添加记录</h2>
          <div class="field">
            <label>日期</label>
            <input type="date" id="ae-date" value="${todayStr()}" max="${todayStr()}">
          </div>
          <div class="field">
            <label>照片</label>
            <div class="photo-picker" id="ae-picker">
              <div id="ae-picker-placeholder">点击拍照或从相册选择</div>
              <img id="ae-preview" style="display:none;">
            </div>
            <input type="file" id="ae-file" accept="image/*" capture="environment" style="display:none;">
          </div>
          <div class="field">
            <label>备注（可选）</label>
            <textarea id="ae-note" placeholder="例如：刷牙后出血明显减少"></textarea>
          </div>
          <div class="sheet-actions">
            <button class="cancel" id="ae-cancel">取消</button>
            <button class="save" id="ae-save" disabled>保存</button>
          </div>
        </div>
      </div>
    `;
    let compressedData = null;
    root.querySelector('#ae-picker').onclick = () => root.querySelector('#ae-file').click();
    root.querySelector('#ae-file').onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      showToast('正在处理照片…');
      compressedData = await compressImage(file);
      const img = root.querySelector('#ae-preview');
      img.src = compressedData;
      img.style.display = 'block';
      root.querySelector('#ae-picker-placeholder').style.display = 'none';
      root.querySelector('#ae-save').disabled = false;
    };
    root.querySelector('#ae-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#ae-save').onclick = async () => {
      const date = root.querySelector('#ae-date').value;
      const note = root.querySelector('#ae-note').value.trim();
      if(!date || !compressedData){ showToast('请选择日期和照片'); return; }
      const projectId = modal.projectId;
      const meta = await loadMeta(projectId);
      const idx = meta.findIndex(m=>m.date===date);
      if(idx>=0){ meta[idx].note = note; } else { meta.push({date, note}); }
      await saveMeta(projectId, meta);
      await savePhoto(projectId, date, compressedData);
      const proj = projects.find(p=>p.id===projectId);
      proj.count = meta.length;
      proj.lastDate = meta.reduce((a,b)=> a>b.date?a:b.date, meta[0].date);
      await saveProjects();
      modal = null;
      render();
    };
  }

  if(modal.type === 'confirmDeleteProject'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>删除项目</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">此项目下的所有照片和记录都会被删除，且无法恢复。确定要删除吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="cd-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="cd-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#cd-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#cd-confirm').onclick = async () => {
      const id = modal.id;
      const meta = await loadMeta(id);
      for(const e of meta){ await deletePhoto(id, e.date); }
      try{ const r = await S.get('meta:'+id); if(r) await S.delete('meta:'+id); }catch(e){}
      projects = projects.filter(p=>p.id!==id);
      await saveProjects();
      modal = null;
      view = { name:'home' };
      render();
    };
  }

  if(modal.type === 'confirmDeleteEntry'){
    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="sheet">
          <h2>删除这条记录</h2>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">${fmtDate(modal.date)} 的照片和备注会被删除。确定吗？</p>
          <div class="sheet-actions">
            <button class="cancel" id="ce-cancel">取消</button>
            <button class="save" style="background:var(--danger);" id="ce-confirm">删除</button>
          </div>
        </div>
      </div>
    `;
    root.querySelector('#ce-cancel').onclick = () => { modal=null; render(); };
    root.querySelector('#modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay'){ modal=null; render(); } };
    root.querySelector('#ce-confirm').onclick = async () => {
      const { projectId, date } = modal;
      let meta = await loadMeta(projectId);
      meta = meta.filter(m=>m.date!==date);
      await saveMeta(projectId, meta);
      await deletePhoto(projectId, date);
      const proj = projects.find(p=>p.id===projectId);
      proj.count = meta.length;
      proj.lastDate = meta.length ? meta.reduce((a,b)=> a>b.date?a:b.date, meta[0].date) : null;
      await saveProjects();
      selected.delete(date);
      modal = null;
      render();
    };
  }
}

/* ---------------- Bindings ---------------- */

function bindHome(){
  document.getElementById('new-project-btn').onclick = () => { modal = {type:'newProject'}; render(); };
  document.querySelectorAll('.project-card').forEach(card=>{
    card.addEventListener('click', (e) => {
      if(e.target.dataset.del) return;
      view = { name:'project', id: card.dataset.id };
      compareMode = false; selected = new Set();
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      modal = { type:'confirmDeleteProject', id: el.dataset.del };
      render();
    });
  });
}

function bindProject(proj, meta){
  document.getElementById('back-btn').onclick = () => { view = {name:'home'}; compareMode=false; selected=new Set(); render(); };

  // load thumbnails async
  meta.forEach(async (e) => {
    const photo = await loadPhoto(proj.id, e.date);
    const imgEl = document.querySelector(`[data-thumb="${e.date}"]`);
    if(imgEl && photo) imgEl.src = photo;
  });

  if(compareMode){
    document.getElementById('cancel-compare-btn').onclick = () => { compareMode=false; selected=new Set(); render(); };
    document.querySelectorAll('[data-check]').forEach(el=>{
      el.addEventListener('click', () => {
        const d = el.dataset.check;
        if(selected.has(d)) selected.delete(d);
        else { if(selected.size>=5){ showToast('最多选择 5 个日期'); return; } selected.add(d); }
        render();
      });
    });
    const genBtn = document.getElementById('gen-compare-btn');
    if(genBtn) genBtn.onclick = async () => {
      showToast('正在生成对比图…');
      const dates = Array.from(selected).sort();
      const entries = [];
      for(const d of dates){
        const photo = await loadPhoto(proj.id, d);
        const m = meta.find(x=>x.date===d);
        entries.push({ date: d, note: m ? m.note : '', photo });
      }
      const image = await generateComparison(proj.name, entries);
      view = { name:'compareResult', id: proj.id, image };
      compareMode = false; selected = new Set();
      render();
    };
  } else {
    const toggleBtn = document.getElementById('toggle-compare-btn');
    if(toggleBtn) toggleBtn.onclick = () => { if(meta.length<2) return; compareMode=true; selected=new Set(); render(); };
    document.getElementById('add-entry-btn').onclick = () => { modal = {type:'addEntry', projectId: proj.id}; render(); };
    document.querySelectorAll('[data-del-entry]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        modal = { type:'confirmDeleteEntry', projectId: proj.id, date: el.dataset.delEntry };
        render();
      });
    });
  }
}

function bindCompareResult(){
  document.getElementById('back-btn').onclick = () => { view = {name:'project', id: view.id}; render(); };
}

/* ---------------- Init ---------------- */

(async function init(){
  await loadProjects();
  render();
})();
</script>
</body>
</html>
