<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>Trace — Personal Progress</title>
<style>
:root{
  --bg:#f7f4ef;--card:#fffdfa;--ink:#292724;--muted:#918b82;--line:#e7e1d8;
  --soft:#eee9e1;--accent:#8a7864;--danger:#9d5d55;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit} button{cursor:pointer}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:88px}
header{padding:30px 20px 18px;display:flex;align-items:end;justify-content:space-between}
h1{font-size:28px;letter-spacing:-.7px;margin:0;font-weight:650}
.sub{font-size:13px;color:var(--muted);margin-top:5px}
.iconbtn{border:1px solid var(--line);background:var(--card);width:42px;height:42px;border-radius:50%;font-size:20px}
main{padding:0 16px}.section-title{font-size:13px;color:var(--muted);padding:4px 5px 10px}
.project{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:17px;
display:flex;gap:14px;align-items:center}
.project-thumb{width:64px;height:64px;border-radius:13px;background:var(--soft);overflow:hidden;flex:none}
.project-thumb img{width:100%;height:100%;object-fit:cover}.project-info{min-width:0;flex:1}
.project-name{font-size:17px;font-weight:600}.project-meta{font-size:12px;color:var(--muted);margin-top:6px}
.arrow{color:#aaa;font-size:20px}.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);height:54px;padding:0 23px;border:0;border-radius:28px;background:var(--ink);color:white;font-weight:600;box-shadow:0 8px 28px #0001}
.view{display:none}.view.active{display:block}.topbar{height:70px;padding:15px 16px;display:flex;align-items:center;gap:10px}
.back{border:0;background:none;font-size:24px;padding:8px}.top-title{font-weight:650;font-size:18px;flex:1}
.primary{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
.timeline{padding:0 16px}.entry{margin:0 0 25px}.date{font-size:14px;font-weight:650;margin:0 4px 9px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.photo-grid.one{grid-template-columns:1fr}
.photo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#eee}
.note{font-size:13px;color:#777;margin:9px 4px 0;line-height:1.55}
.form{padding:0 18px}.label{font-size:13px;color:var(--muted);margin:20px 0 8px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px;color:var(--ink);outline:none}
textarea{min-height:100px;resize:vertical}.upload{border:1.5px dashed #cfc7bc;background:var(--card);border-radius:16px;min-height:170px;
display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload strong{display:block;color:var(--ink);margin-bottom:5px}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.preview div{position:relative}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.remove{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:23px;height:23px;background:#0008;color:#fff}
.savebar{padding:18px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%)}.savebar button{width:100%;height:48px}
.choice-row{display:flex;gap:8px}.choice{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;color:var(--muted)}
.choice.selected{border-color:var(--ink);color:var(--ink);background:#eee9e1}
.records{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.record{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden}
.record img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.record-body{padding:9px}.record-date{font-size:12px;font-weight:650}.record-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.check{position:absolute;right:8px;top:8px;width:25px;height:25px;border-radius:50%;border:1px solid #fff;background:#ffffffdd;color:transparent;display:flex;align-items:center;justify-content:center;font-size:14px}
.record.selected .check{background:var(--ink);color:#fff}.record.selected{outline:2px solid var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:5px 2px 15px}
.result-wrap{padding:8px 16px 30px}.compare{background:#fff;border-radius:4px;padding:12px;box-shadow:0 3px 15px #0000000d}
.compare.vertical .compare-item{margin-bottom:12px}.compare.horizontal{display:flex;gap:8px;overflow:hidden}.compare.horizontal .compare-item{flex:1;min-width:0}
.compare-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:2px}
.compare-date{font-size:11px;font-weight:700;margin-top:7px}.compare-note{font-size:10px;color:#777;margin-top:3px;line-height:1.4}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.actions .dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.small{font-size:12px;color:var(--muted)}
@media(min-width:621px){.app{box-shadow:0 0 50px #00000008}.fab{position:fixed;max-width:300px}}

.editor{padding:0 16px 24px}.editor-stage{background:#e9e4dc;border-radius:16px;padding:12px;overflow:auto}
.canvas-wrap{position:relative;margin:auto;background:#fffdfa;overflow:hidden;touch-action:none}
.canvas-item{position:absolute;transform-origin:center center;user-select:none;touch-action:none}
.canvas-item img{display:block;max-width:none;pointer-events:none}
.canvas-label{position:absolute;left:0;bottom:-38px;font-size:12px;white-space:nowrap;color:#292724}
.edit-controls{display:flex;gap:8px;margin-top:12px}.edit-controls button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;height:42px}
.size-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.size-row input{padding:0;border:0;background:transparent}

.compare-editor{background:#e8e2d9;border-radius:16px;padding:12px;overflow:hidden}
.edit-toolbar{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}
.edit-toolbar button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:12px}
.edit-toolbar button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.edit-stage{position:relative;background:#fffdfa;border-radius:10px;overflow:hidden;min-height:360px;touch-action:none}
.edit-stage canvas{width:100%;height:auto;display:block;touch-action:none}
.edit-controls{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;padding:12px}
.range-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.range-row input{padding:0;border:0;background:transparent;flex:1}
.range-value{width:40px;text-align:right;color:var(--ink)}
.editor-help{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
.date-source{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="view active">
    <header><div><h1>Trace</h1><div class="sub">记录每一个变化</div></div><button class="iconbtn" onclick="openNewProject()">＋</button></header>
    <main><div class="section-title">我的项目</div><div id="projectList"></div></main>
    <button class="fab" onclick="openNewProject()">＋ 新建项目</button>
  </section>

  <section id="detail" class="view">
    <div class="topbar"><button class="back" onclick="go('home')">‹</button><div class="top-title" id="detailTitle"></div><button class="primary" onclick="openAdd()">＋ 记录</button></div>
    <div class="timeline" id="timeline"></div>
    <div class="savebar"><button class="primary" onclick="openCompare()">生成对比</button></div>
  </section>

  <section id="newProject" class="view">
    <div class="topbar"><button class="back" onclick="go('home')">‹</button><div class="top-title">新建项目</div></div>
    <div class="form">
      <div class="label">项目名称</div><input id="projectName" placeholder="例如：牙齿 / Face / 体态">
      <div class="label">类型</div>
      <div class="choice-row" id="typeChoices">
        <button class="choice selected" onclick="selectType(this)">牙齿</button><button class="choice" onclick="selectType(this)">脸部</button>
        <button class="choice" onclick="selectType(this)">体态</button><button class="choice" onclick="selectType(this)">自定义</button>
      </div>
      <div class="savebar"><button class="primary" onclick="createProject()">创建项目</button></div>
    </div>
  </section>

  <section id="add" class="view">
    <div class="topbar"><button class="back" onclick="go('detail')">‹</button><div class="top-title">添加记录</div></div>
    <div class="form">
      <div class="label">日期</div><input type="date" id="recordDate"><div class="date-source" id="dateSource">选择照片后，会优先读取照片的拍摄日期</div>
      <div class="label">照片 <span class="small">最多 6 张</span></div>
      <div class="upload"><input id="photoInput" type="file" accept="image/*" multiple onchange="handleFiles(event)"><div><strong>＋ 添加照片</strong>从相册选择照片</div></div>
      <div class="preview" id="preview"></div>
      <div class="label">备注 <span class="small">可选</span></div><textarea id="recordNote" placeholder="写一点今天的情况…"></textarea>
      <div class="savebar"><button class="primary" onclick="saveRecord()">保存记录</button></div>
    </div>
  </section>

  <section id="compare" class="view">
    <div class="topbar"><button class="back" onclick="go('detail')">‹</button><div class="top-title">选择对比</div><button class="primary" onclick="makeCompare()">生成</button></div>
    <div class="form">
      <div class="hint">选择 2–5 个日期，按时间顺序排列</div>
      <div class="records" id="recordChoices"></div>
      <div class="label">排列方式</div>
      <div class="choice-row"><button id="vBtn" class="choice selected" onclick="setLayout('vertical')">纵向</button><button id="hBtn" class="choice" onclick="setLayout('horizontal')">横向</button></div>
    </div>
  </section>

  <section id="result" class="view">
    <div class="topbar"><button class="back" onclick="go('compare')">‹</button><div class="top-title">对比图</div></div>
    <div class="editor">
      <div class="editor-stage"><div id="editStage" class="canvas-wrap"></div></div>
      <div class="size-row"><span>选中照片大小</span><input id="sizeSlider" type="range" min="60" max="160" value="100" oninput="scaleSelected(this.value)"></div>
      <div class="edit-controls"><button onclick="resetEditor()">恢复布局</button><button onclick="go('compare')">重新选择</button><button class="dark" onclick="downloadEdited()">保存图片</button></div>
      <div class="small" style="margin-top:10px">提示：拖动照片调整位置，双指缩放或用下方滑杆调整大小。</div>
    </div>
  </section>
</div>

<script>
const KEY='trace_data_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"projects":[]}');
let currentProject=null, files=[], selected=[], layout='vertical', compareUrls=[];
let editorRecords=[], editorIndex=0, editorScale=[], editorOffset=[], editorCanvas=null, editorCtx=null, editorImages=[];
let dragState=null, pinchState=null;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function openNewProject(){ $('projectName').value=''; go('newProject') }
function selectType(el){document.querySelectorAll('#typeChoices .choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function createProject(){
 const name=$('projectName').value.trim(); if(!name){alert('请输入项目名称');return}
 const type=document.querySelector('#typeChoices .selected').textContent;
 const p={id:Date.now(),name,type,records:[]};data.projects.unshift(p);persist();openProject(p.id)
}
function openProject(id){currentProject=data.projects.find(p=>p.id===id);$('detailTitle').textContent=currentProject.name;renderTimeline();go('detail')}
function renderHome(){
 const el=$('projectList');el.innerHTML='';
 if(!data.projects.length){el.innerHTML='<div class="empty">还没有项目<br><br>从一个你想记录的变化开始。</div>';return}
 data.projects.forEach(p=>{
  const latest=[...p.records].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const thumb=latest?.photos?.[0];
  const div=document.createElement('div');div.className='project';div.onclick=()=>openProject(p.id);
  div.innerHTML=`<div class="project-thumb">${thumb?`<img src="${thumb}">`:''}</div><div class="project-info"><div class="project-name">${esc(p.name)}</div><div class="project-meta">${p.records.length} 次记录${p.records.length?' · 最近 '+p.records.sort((a,b)=>b.date.localeCompare(a.date))[0].date:''}</div></div><div class="arrow">›</div>`;
  el.appendChild(div);
 })}
function renderTimeline(){
 const el=$('timeline');el.innerHTML='';
 const rs=[...currentProject.records].sort((a,b)=>b.date.localeCompare(a.date));
 if(!rs.length){el.innerHTML='<div class="empty">还没有记录<br><br>点击右上角「＋ 记录」开始。</div>';return}
 rs.forEach(r=>{
  const e=document.createElement('div');e.className='entry';
  e.innerHTML=`<div class="date">${formatDate(r.date)}</div><div class="photo-grid ${r.photos.length===1?'one':''}">${r.photos.map(x=>`<img src="${x}">`).join('')}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}`;
  el.appendChild(e);
 })}
function openAdd(){files=[];$('preview').innerHTML='';$('recordDate').value=new Date().toISOString().slice(0,10);$('recordDate').dataset.manual='';$('recordDate').onchange=()=>{$('recordDate').dataset.manual='1'};$('recordNote').value='';$('photoInput').value='';go('add')}
async function getPhotoDate(file){
  try{
    const buf=await file.arrayBuffer(), view=new DataView(buf);
    if(view.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o+4<view.byteLength){
      if(view.getUint8(o)!==0xFF){o++;continue}
      const marker=view.getUint8(o+1), len=view.getUint16(o+2);
      if(marker===0xE1){
        const start=o+4;
        if(view.getUint32(start)===0x45786966 && view.getUint16(start+4)===0){
          const t=start+6, little=view.getUint16(t)===0x4949;
          const u16=(x)=>view.getUint16(x,little), u32=(x)=>view.getUint32(x,little);
          const ifd=t+u32(t+4), count=u16(ifd);
          for(let i=0;i<count;i++){
            const e=ifd+2+i*12, tag=u16(e), type=u16(e+2), n=u32(e+4);
            if(tag===0x9003 || tag===0x0132){
              const off=n*({1:1,2:1,3:2,4:4,5:8}[type]||1)>4?u32(e+8):e+8;
              let str='';for(let j=0;j<19;j++)str+=String.fromCharCode(view.getUint8(off+j));
              const m=str.match(/(\d{4})[:\-](\d{2})[:\-](\d{2})/);
              if(m)return `${m[1]}-${m[2]}-${m[3]}`;
            }
          }
        }
      }
      o+=2+len;
    }
  }catch(err){}
  return null;
}
async function handleFiles(e){
 const incoming=[...e.target.files].slice(0,6-files.length);
 for(const f of incoming){
   const r=new FileReader();
   const date=await getPhotoDate(f);
   if(date && !$('recordDate').dataset.manual) $('recordDate').value=date;
   r.onload=ev=>{files.push(ev.target.result);renderPreview()};
   r.readAsDataURL(f);
 }
}

function renderPreview(){$('preview').innerHTML=files.map((x,i)=>`<div><img src="${x}"><button class="remove" onclick="removeFile(${i})">×</button></div>`).join('')}
function removeFile(i){files.splice(i,1);renderPreview()}
function saveRecord(){
 if(!files.length){alert('请至少添加一张照片');return}
 currentProject.records.push({id:Date.now(),date:$('recordDate').value,photos:files,note:$('recordNote').value.trim()});
 persist();renderTimeline();renderHome();go('detail')
}
function openCompare(){
 if(currentProject.records.length<2){alert('至少需要 2 次记录才能生成对比图');return}
 selected=[];renderChoices();go('compare')
}
function renderChoices(){
 const el=$('recordChoices');el.innerHTML='';
 [...currentProject.records].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
  const d=document.createElement('div');d.className='record'+(selected.includes(r.id)?' selected':'');
  d.onclick=()=>toggleSelect(r.id);d.innerHTML=`<img src="${r.photos[0]}"><div class="check">✓</div><div class="record-body"><div class="record-date">${formatDate(r.date)}</div><div class="record-note">${esc(r.note||'无备注')}</div></div>`;
  el.appendChild(d)
 })}
function toggleSelect(id){
 if(selected.includes(id))selected=selected.filter(x=>x!==id);
 else if(selected.length<5)selected.push(id);else {alert('最多选择 5 个日期');return}
 renderChoices()
}
function setLayout(x){layout=x;$('vBtn').classList.toggle('selected',x==='vertical');$('hBtn').classList.toggle('selected',x==='horizontal')}
function makeCompare(){
 if(selected.length<2){alert('请选择至少 2 个日期');return}
 editorRecords=selected.map(id=>currentProject.records.find(r=>r.id===id)).sort((a,b)=>a.date.localeCompare(b.date));
 editorScale=editorRecords.map(()=>1); editorOffset=editorRecords.map(()=>({x:0,y:0}));
 editorIndex=0; compareUrls=editorRecords.map(r=>r.photos[0]);
 setupEditor(); go('result')
}
function setupEditor(){
 editorCanvas=$('editCanvas'); editorCtx=editorCanvas.getContext('2d');
 $('editToolbar').innerHTML=editorRecords.map((r,i)=>`<button class="${i===0?'active':''}" onclick="selectEditorImage(${i})">${formatDate(r.date)}</button>`).join('');
 editorImages=[]; let loaded=0;
 editorRecords.forEach((r,i)=>{const im=new Image();im.onload=()=>{editorImages[i]=im;if(++loaded===editorRecords.length){drawEditor();}};im.src=r.photos[0]});
 updateEditorControls(); bindEditorGestures();
}
function selectEditorImage(i){editorIndex=i;document.querySelectorAll('#editToolbar button').forEach((b,n)=>b.classList.toggle('active',n===i));updateEditorControls();drawEditor()}
function updateEditorControls(){
 const v=Math.round(editorScale[editorIndex]*100);$('sizeRange').value=v;$('sizeValue').textContent=v+'%'
}
function changeImageSize(v){editorScale[editorIndex]=Number(v)/100;$('sizeValue').textContent=v+'%';drawEditor()}
function fitRect(im, boxW, boxH){
 const s=Math.max(boxW/im.width, boxH/im.height); return {w:im.width*s,h:im.height*s}
}
function drawEditor(){
 if(!editorCtx || !editorImages.length)return;
 const W=900, gap=24, pad=38, labelH=72;
 let itemW, itemH;
 if(layout==='horizontal'){itemW=(W-pad*2-gap*(editorRecords.length-1))/editorRecords.length; itemH=Math.round(itemW*1.08)}
 else {itemW=W-pad*2; itemH=Math.round(itemW*0.82)}
 const H=layout==='horizontal'?itemH+labelH+pad*2:editorRecords.length*(itemH+labelH+gap)+pad*2;
 editorCanvas.width=W;editorCanvas.height=H;
 editorCtx.fillStyle='#fffdfa';editorCtx.fillRect(0,0,W,H);
 editorRecords.forEach((r,i)=>{
   const x=layout==='horizontal'?pad+i*(itemW+gap):pad;
   const y=layout==='horizontal'?pad:pad+i*(itemH+labelH+gap);
   const im=editorImages[i]; if(!im)return;
   const fit=fitRect(im,itemW,itemH), sc=editorScale[i], ow=fit.w*sc, oh=fit.h*sc;
   const ox=editorOffset[i].x, oy=editorOffset[i].y;
   editorCtx.save();editorCtx.beginPath();editorCtx.rect(x,y,itemW,itemH);editorCtx.clip();
   editorCtx.drawImage(im,x+(itemW-ow)/2+ox,y+(itemH-oh)/2+oy,ow,oh);editorCtx.restore();
   editorCtx.fillStyle='#292724';editorCtx.font='600 20px -apple-system, sans-serif';editorCtx.fillText(formatDate(r.date),x,y+itemH+30);
   if(r.note){editorCtx.fillStyle='#777';editorCtx.font='15px -apple-system, sans-serif';editorCtx.fillText(r.note.slice(0,Math.max(10,Math.floor(itemW/10))),x,y+itemH+55)}
 });
}
function pointerPoint(e){const r=editorCanvas.getBoundingClientRect();return {x:(e.clientX-r.left)*(editorCanvas.width/r.width),y:(e.clientY-r.top)*(editorCanvas.height/r.height)}}
function bindEditorGestures(){
 if(editorCanvas._bound)return; editorCanvas._bound=true;
 editorCanvas.addEventListener('pointerdown',e=>{editorCanvas.setPointerCapture(e.pointerId);dragState={id:e.pointerId,p:pointerPoint(e),ox:editorOffset[editorIndex].x,oy:editorOffset[editorIndex].y}});
 editorCanvas.addEventListener('pointermove',e=>{if(!dragState||dragState.id!==e.pointerId)return;const q=pointerPoint(e);editorOffset[editorIndex].x=dragState.ox+q.x-dragState.p.x;editorOffset[editorIndex].y=dragState.oy+q.y-dragState.p.y;drawEditor()});
 editorCanvas.addEventListener('pointerup',()=>dragState=null);editorCanvas.addEventListener('pointercancel',()=>dragState=null);
 let touches=[];
 editorCanvas.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();touches=[...e.touches];pinchState={base:dist(touches[0],touches[1]),scale:editorScale[editorIndex]}}},{passive:false});
 editorCanvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchState){e.preventDefault();const d=dist(e.touches[0],e.touches[1]);editorScale[editorIndex]=Math.max(.5,Math.min(1.4,pinchState.scale*d/pinchState.base));updateEditorControls();drawEditor()}},{passive:false});
 editorCanvas.addEventListener('touchend',e=>{if(e.touches.length<2)pinchState=null});
}
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function downloadEdited(){
 const a=document.createElement('a');a.download=`Trace-${currentProject.name}-${Date.now()}.jpg`;a.href=editorCanvas.toDataURL('image/jpeg',.92);a.click()
}

function exifDateFromDataURL(dataUrl){
 try{
  const bin=atob(dataUrl.split(',')[1]); if(bin.charCodeAt(0)!==0xFF||bin.charCodeAt(1)!==0xD8)return null;
  let i=2;
  while(i<bin.length-1){
   if(bin.charCodeAt(i)!==0xFF){i++;continue}
   const marker=bin.charCodeAt(i+1); if(marker===0xD9||marker===0xDA)break;
   const len=(bin.charCodeAt(i+2)<<8)|bin.charCodeAt(i+3);
   if(marker===0xE1 && bin.substr(i+4,6)==='Exif\\0\\0'){
    const t=i+10, little=bin.charCodeAt(t)===0x49;
    const u16=o=>little?(bin.charCodeAt(o)|bin.charCodeAt(o+1)<<8):(bin.charCodeAt(o)<<8|bin.charCodeAt(o+1));
    const u32=o=>little?(bin.charCodeAt(o)|bin.charCodeAt(o+1)<<8|bin.charCodeAt(o+2)<<16|bin.charCodeAt(o+3)<<24)>>>0:((bin.charCodeAt(o)<<24|bin.charCodeAt(o+1)<<16|bin.charCodeAt(o+2)<<8|bin.charCodeAt(o+3))>>>0);
    const ifd=t+u32(t+4); const n=u16(ifd);
    for(let k=0;k<n;k++){const o=ifd+2+k*12, tag=u16(o), type=u16(o+2), count=u32(o+4);if(tag===0x9003||tag===0x0132){let ptr=count<=4?o+8:t+u32(o+8);let s='';for(let j=0;j<19&&ptr+j<bin.length;j++){const c=bin.charCodeAt(ptr+j);if(c===0)break;s+=String.fromCharCode(c)};const m=s.match(/(\\d{4}):(\\d{2}):(\\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`}}
   }
   i+=2+len;
  }
 }catch(e){}
 return null;
}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
